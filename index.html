<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>숲속 텐트 영어 친구</title>
<style>
:root{
  --ink:#24402c;
  --sky1:#bfe9ff;
  --sky2:#eefcff;
  --grass:#8fd46b;
  --yellow:#ffd45c;
  --pink:#ff6f91;
  --green:#2ecc71;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:var(--ink);
  height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,#d9f7c4 80%);
}
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.cloud{position:absolute;width:120px;height:44px;background:#fff;border-radius:50px;opacity:.9;animation:drift 28s linear infinite;left:-140px}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:52px;height:52px;left:18px;top:-22px}
.cloud::after{width:68px;height:68px;left:48px;top:-32px}
.c1{top:52px}.c2{top:175px;width:90px;height:34px;animation-duration:36s;animation-delay:-12s}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(120vw)}}
.hill{position:fixed;bottom:-145px;left:-15%;width:130%;height:290px;border-radius:50%;background:var(--grass);z-index:-1}

/* Top Header */
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;flex-shrink:0}
.book-pill{flex:1;min-width:0;height:46px;background:#fff;border-radius:999px;padding:0 14px;box-shadow:0 4px 0 rgba(36,64,44,.16);display:flex;align-items:center;gap:8px;border:none;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left}
.book-pill:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(36,64,44,.16)}
.tag{font-size:12px;font-weight:900;color:#b25e00;background:#ffe9b8;border-radius:999px;padding:4px 9px;white-space:nowrap;flex-shrink:0}
.book-title{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mode-pill{height:46px;border-radius:999px;border:none;background:#fff;padding:0 13px;box-shadow:0 4px 0 rgba(36,64,44,.18);display:flex;align-items:center;gap:5px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:900;color:var(--ink);white-space:nowrap;flex-shrink:0;transition:all .15s}
.mode-pill.auto{background:#2ecc71;color:#fff;box-shadow:0 4px 0 #1f9d55}
.mode-pill:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(36,64,44,.18)}
.round-btn{width:46px;height:46px;border-radius:50%;border:none;background:#fff;box-shadow:0 4px 0 rgba(36,64,44,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;position:relative}
.round-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(36,64,44,.18)}
.lock-dot{position:absolute;right:4px;bottom:4px;width:14px;height:14px;border-radius:50%;background:#ffe9b8;border:1.5px solid #c98a00;display:flex;align-items:center;justify-content:center}

/* Stage & Teacher (Zero-Scroll Compact Vertical Fit) */
.stage{
  flex:1;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(6px,1.2dvh,10px);
  padding:4px 16px;
  overflow:hidden;
}
.teacher-wrap{
  position:relative;
  width:clamp(84px,13.5dvh,112px);
  height:clamp(84px,13.5dvh,112px);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.mic-ring{position:absolute;inset:1px;border-radius:50%;border:4px solid rgba(46,204,113,0);transform:scale(1);transition:transform .08s ease-out,border-color .2s,background-color .2s;pointer-events:none}
.teacher-wrap.listening .mic-ring{border-color:rgba(46,204,113,.55);background:rgba(46,204,113,.12);transform:scale(var(--mic-scale,1.06))}
.teacher-wrap.talking .mic-ring{border-color:rgba(255,179,0,.45);background:rgba(255,212,92,.14);animation:talkRing .9s ease-in-out infinite}
@keyframes talkRing{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.teacher{width:90%;height:90%;position:relative;z-index:1;transition:transform .25s}
.teacher-wrap.talking .teacher{animation:bob .55s ease-in-out infinite}
.teacher-wrap.listening .teacher{transform:scale(1.04)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.mouth-open{display:none}
.teacher-wrap.talking .mouth-idle{display:none}
.teacher-wrap.talking .mouth-open{display:block;animation:talkMouth .28s ease-in-out infinite alternate}
@keyframes talkMouth{from{transform:scaleY(.65);transform-origin:60px 83px}to{transform:scaleY(1.18);transform-origin:60px 83px}}
.eyes-happy{display:none}
.teacher-wrap.happy .eyes-normal{display:none}
.teacher-wrap.happy .eyes-happy{display:block}
.ear-wave{opacity:0;transition:opacity .2s}
.teacher-wrap.listening .ear-wave{opacity:1;animation:earPulse 1.1s ease-in-out infinite}
@keyframes earPulse{0%,100%{opacity:.35}50%{opacity:1}}

/* Turn Indicator Pill */
.turn-pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 14px;border-radius:999px;
  font-size:14px;font-weight:900;
  background:#fff;color:var(--ink);
  box-shadow:0 3px 0 rgba(36,64,44,.12);
  border:2px solid #dbeccd;
  min-height:32px;
  flex-shrink:0;
  transition:all .2s;
}
.turn-pill.talking{background:#fff8db;border-color:#ffb300;color:#8a4b00}
.turn-pill.listening{background:#e8f9ef;border-color:#2ecc71;color:#146c38}
.turn-pill.auto{background:#eef6ff;border-color:#5ba4ff;color:#154c96}
.turn-pill.hidden{display:none}
.turn-dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex-shrink:0}
.turn-pill.listening .turn-dot{animation:dotBlink .9s infinite}
@keyframes dotBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}

.caption{display:none;max-width:440px;text-align:center;font-size:15px;font-weight:800;color:#245234;background:rgba(255,255,255,.9);border-radius:16px;padding:7px 14px;line-height:1.38;box-shadow:0 3px 0 rgba(36,64,44,.08);flex-shrink:0}
.caption.show{display:block}

/* Main Card - Natural Sentence Flow (No Boxes, Original Word Spacing) */
.card{
  width:100%;max-width:460px;
  min-height:clamp(155px,24dvh,205px);
  background:#fff;border-radius:30px;
  padding:clamp(16px,2.4dvh,22px) 18px;
  box-shadow:0 9px 0 rgba(36,64,44,.14);
  text-align:center;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  gap:10px;
  border:5px solid var(--yellow);
  transition:border-color .2s,box-shadow .2s;
  flex-shrink:0;
}
.card.auto-active{border-color:#2ecc71}
.card.listening-active{border-color:#2ecc71;box-shadow:0 9px 0 rgba(46,204,113,.22)}
.card.empty{border-color:#bfe3a8}
.card .en{
  font-size:clamp(28px,8vw,42px);
  font-weight:900;line-height:1.4;color:#1d3b5c;
  word-break:keep-all;
  display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;
  gap:2px 2px;
}
.card .en.small{font-size:22px}
.word-btn{
  display:inline-block;
  padding:2px 4px;
  border-radius:10px;
  cursor:pointer;
  transition:transform .12s,background-color .15s,box-shadow .15s,color .15s;
}
.word-btn:hover{background:#fff6d6}
.word-btn:active{transform:scale(.95)}
.word-btn.active{background:#ffe07d;color:#663c00;box-shadow:0 3px 0 #e6b822;transform:translateY(-1px)}

.word-meaning-box{display:none;align-items:center;justify-content:center}
.word-meaning-box.show{display:flex}
.word-meaning-pill{
  display:inline-flex;align-items:center;gap:7px;
  background:#f0f9f2;border:2px solid #8fd46b;color:#1b5e20;
  font-size:17px;font-weight:900;
  padding:6px 15px;border-radius:999px;
  cursor:pointer;font-family:inherit;
  box-shadow:0 3px 0 rgba(27,94,32,.12);
  animation:popIn .16s ease-out;
}
.word-meaning-pill:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(27,94,32,.12)}
.word-meaning-pill strong{color:#0d47a1}
.word-meaning-pill .spk-ic{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#d8f3dc;color:#1b5e20;flex-shrink:0}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.card .hint{font-size:13px;font-weight:700;color:#8a9a8f;white-space:nowrap}

.card.finish{border-color:#ffb300;background:linear-gradient(180deg,#fffdf2 0%,#fff6d1 100%);gap:10px}
.trophy-badge{width:64px;height:64px;border-radius:50%;background:#ffe07d;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #e0a800}
.finish-title{font-size:24px;font-weight:900;color:#b25e00;line-height:1.25}
.finish-sub{font-size:15px;font-weight:800;color:#4b6b55}
.finish-actions{display:flex;gap:10px;width:100%;margin-top:4px}
.finish-btn{flex:1;padding:13px 10px;border-radius:18px;border:none;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit}
.finish-btn.again{background:#fff;color:var(--ink);border:3px solid #ffd45c;box-shadow:0 4px 0 #e0b840}
.finish-btn.other{background:var(--pink);color:#fff;box-shadow:0 4px 0 #c94a68}
.finish-btn:active{transform:translateY(3px)}

.dots{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;min-height:14px;flex-shrink:0}
.dot{width:11px;height:11px;border-radius:50%;background:rgba(36,64,44,.18);transition:all .25s}
.dot.done{background:#2ecc71;transform:scale(1.05)}
.dot.cur{background:#ffb300;box-shadow:0 0 0 3px rgba(255,179,0,.35);transform:scale(1.2)}
.book-big{font-size:28px;font-weight:900;color:#1d3b5c;line-height:1.3}
.start-book{margin-top:6px;padding:15px 30px;border-radius:24px;border:none;background:var(--pink);color:#fff;font-size:21px;font-weight:900;box-shadow:0 6px 0 #c94a68;cursor:pointer;font-family:inherit}
.start-book:active{transform:translateY(4px);box-shadow:0 2px 0 #c94a68}
.childline{font-size:13.5px;font-weight:800;color:#1f6f3d;min-height:18px;text-align:center;flex-shrink:0}

/* Bottom Dock - Strictly Symmetric 5-Column Alignment */
.dock{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  padding:6px 10px calc(12px + env(safe-area-inset-bottom, 0px));
  max-width:520px;width:100%;margin:0 auto;
  align-items:end;
  flex-shrink:0;
}
.ctl{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;border:none;background:none;cursor:pointer;font-family:inherit}
.ctl .face{
  width:58px;height:58px;border-radius:19px;background:#fff;
  box-shadow:0 5px 0 rgba(36,64,44,.2);
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s,box-shadow .1s,background-color .2s;
}
.ctl:active .face{transform:translateY(3px);box-shadow:0 2px 0 rgba(36,64,44,.2)}
.ctl:disabled{opacity:.38;cursor:default}
.ctl:disabled:active .face{transform:none;box-shadow:0 5px 0 rgba(36,64,44,.2)}
.ctl > span:last-child{font-size:12.5px;font-weight:900;color:var(--ink);white-space:nowrap;line-height:1.2}
.ctl.mic .face{width:64px;height:64px;border-radius:21px;background:var(--pink);color:#fff;box-shadow:0 5px 0 #c94a68}
.ctl.mic:active .face{transform:translateY(3px);box-shadow:0 2px 0 #c94a68}
.ctl.mic.on .face{background:var(--green);box-shadow:0 5px 0 #1f9d55;animation:pulse 1.15s infinite}
@keyframes pulse{
  0%,100%{box-shadow:0 5px 0 #1f9d55,0 0 0 0 rgba(46,204,113,.5)}
  50%{box-shadow:0 5px 0 #1f9d55,0 0 0 11px rgba(46,204,113,0)}
}
.flag svg{display:block;border-radius:5px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}

/* Splash */
.splash{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 60%,#d9f7c4 100%)}
.splash.hide{display:none}
.splash h1{font-size:32px;font-weight:900;color:#1d5a36;line-height:1.3}
.big-start{padding:20px 42px;font-size:24px;font-weight:900;border:none;border-radius:28px;background:#ffb300;color:#3b2a00;box-shadow:0 8px 0 #c98a00;cursor:pointer;font-family:inherit}
.big-start:active{transform:translateY(5px);box-shadow:0 3px 0 #c98a00}
.msg{font-size:14px;font-weight:800;color:#c62828;min-height:20px;max-width:400px}

/* Modals */
.modal-back{position:fixed;inset:0;background:rgba(36,64,44,.48);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal-back.open{display:flex}
.modal-back.center{align-items:center;padding:18px}
.modal{background:#fffdf5;width:100%;max-width:520px;max-height:92dvh;border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden}
.modal.gate-box{max-width:360px;border-radius:26px;box-shadow:0 16px 40px rgba(0,0,0,.22)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:2px solid #efe7d2}
.modal-head h2{font-size:18px;font-weight:900}
.x{width:40px;height:40px;border-radius:50%;border:none;background:#f0ead8;font-size:18px;font-weight:900;cursor:pointer;color:var(--ink)}
.modal-body{overflow:auto;padding:15px 18px;display:flex;flex-direction:column;gap:15px}
.flabel{display:block;font-weight:900;font-size:15px;margin-bottom:4px}
.fhelp{display:block;font-size:12.5px;font-weight:700;color:#5f7a67;margin-top:4px;line-height:1.4}
input,select{width:100%;padding:12px 14px;border-radius:14px;border:2px solid #cfe5c2;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);margin-top:6px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.sub{padding:10px 14px;border-radius:12px;border:2px solid #cfe5c2;background:#f2faea;font-weight:800;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
.res{font-size:13.5px;font-weight:700}
.res.ok{color:#17803d}.res.bad{color:#c62828}
.seg2,.seg3,.seg4{display:grid;gap:8px;margin-top:6px}
.seg2{grid-template-columns:1fr 1fr}
.seg3{grid-template-columns:1fr 1fr 1fr}
.seg4{grid-template-columns:1fr 1fr}
.seg2 button,.seg3 button,.seg4 button{padding:12px 8px;border-radius:14px;border:3px solid #dbeccd;background:#fff;font-weight:800;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
.seg2 button.on,.seg3 button.on,.seg4 button.on{background:var(--yellow);border-color:#ffb300}
.modal-foot{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:14px 18px;border-top:2px solid #efe7d2}
.primary{padding:14px 26px;border-radius:16px;border:none;background:#ffb300;color:#3b2a00;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 5px 0 #c98a00;font-family:inherit}

/* Parental Gate */
.gate-desc{font-size:14px;font-weight:700;color:#556f5d;text-align:center}
.gate-q{font-size:30px;font-weight:900;color:#1d3b5c;text-align:center;padding:10px;background:#f3f9ee;border-radius:16px;border:2px solid #d5ebc9}
.gate-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gate-opt{padding:15px;border-radius:15px;border:3px solid #dbeccd;background:#fff;font-size:21px;font-weight:900;color:var(--ink);cursor:pointer;font-family:inherit;box-shadow:0 4px 0 rgba(36,64,44,.12)}
.gate-opt:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(36,64,44,.12)}
.gate-err{font-size:13px;font-weight:800;color:#c62828;text-align:center;min-height:18px}

/* Book List */
.book-grid{display:flex;flex-direction:column;gap:10px}
.book-item{width:100%;padding:15px 16px;border-radius:18px;border:3px solid #dbeccd;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;text-align:left;font-family:inherit;box-shadow:0 4px 0 rgba(36,64,44,.12)}
.book-item:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(36,64,44,.12)}
.book-item.active{border-color:#ffb300;background:#fff9e6}
.book-item-title{font-size:18px;font-weight:900;color:var(--ink);line-height:1.25}
.book-item-meta{font-size:13px;font-weight:800;color:#b25e00;background:#ffe9b8;padding:5px 11px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.filter-section{display:flex;flex-direction:column;gap:8px;padding-bottom:10px;border-bottom:2px solid #efe7d2}
.filter-row{display:flex;gap:6px;flex-wrap:wrap}
.filter-chip{padding:8px 14px;border-radius:999px;border:2px solid #cfe5c2;background:#fff;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit;transition:all .15s}
.filter-chip.on{background:var(--yellow);border-color:#ffb300;color:#3b2a00}
.filter-chip.lvl.on{background:#bff0d4;border-color:#2ecc71;color:#14532d}
.book-item-sub{font-size:12px;font-weight:800;color:#6b8773;margin-bottom:2px}
</style>
</head>
<body>

<div class="bg"><span class="cloud c1"></span><span class="cloud c2"></span></div>
<div class="hill"></div>

<header class="top">
  <button type="button" class="book-pill" id="bookPillBtn" title="눌러서 다른 책 고르기">
    <span class="tag">오늘의 책</span>
    <span class="book-title" id="bookTitle">책을 골라 주세요</span>
  </button>
  <button type="button" class="mode-pill" id="autoModeBtn" aria-label="계속 읽기 모드 전환">
    <span id="autoModeIcon">▶</span>
    <span id="autoModeText">계속 읽기</span>
  </button>
  <button type="button" class="round-btn" id="settingsBtn" aria-label="부모님 설정">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#24402c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    <span class="lock-dot" aria-hidden="true">
      <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#8a4b00" stroke-width="3"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </span>
  </button>
</header>

<main class="stage">
  <div class="teacher-wrap" id="teacherWrap">
    <div class="mic-ring" id="micRing"></div>
    <svg class="teacher" id="teacher" viewBox="-12 -10 144 132" aria-hidden="true">
      <path class="ear-wave" d="M6 34 C-2 26, -2 14, 6 6" fill="none" stroke="#2ecc71" stroke-width="4" stroke-linecap="round"/>
      <path class="ear-wave" d="M114 34 C122 26, 122 14, 114 6" fill="none" stroke="#2ecc71" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="30" r="14" fill="#a0673a"/>
      <circle cx="92" cy="30" r="14" fill="#a0673a"/>
      <circle cx="28" cy="30" r="7" fill="#d9a574"/>
      <circle cx="92" cy="30" r="7" fill="#d9a574"/>
      <circle cx="60" cy="62" r="46" fill="#b9793f"/>
      <ellipse cx="60" cy="80" rx="24" ry="18" fill="#f4d7b0"/>
      <g class="eyes-normal">

    `${namePrefix}어서 와! 선생님이 오늘도 기다리고 있었어.`,

    `${namePrefix}와, 왔구나! 오늘 기분은 어때?`

  return pick(pool);

// ---------- WakeLock ----------
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}
function releaseWakeLock() {
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && connected) requestWakeLock();
});

// ---------- 책 목록 ----------
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function buildBooks(rows) {
  const map = new Map();
  rows.forEach((r, i) => {
    let series = '기본 시리즈', level = '전체', title = '', ord = NaN, en = '';
    if (r.length >= 5 && !isNaN(parseInt(r[3], 10))) {
      series = (r[0] || '').trim() || '기타';
      level = (r[1] || '').trim() || '기본';
      title = (r[2] || '').trim();
      ord = parseInt(r[3], 10);
      en = (r[4] || '').trim();
    } else {
      title = (r[0] || '').trim();
      ord = parseInt(r[1], 10);
      en = (r[2] || '').trim();
    }
    if (!title || !en || isNaN(ord)) return;
    const key = `${series}||${level}||${title}`;
    if (!map.has(key)) map.set(key, { series, level, title, list: [] });
    map.get(key).list.push({ ord, i, en });
  });
  return [...map.values()].map(item => ({
    series: item.series,
    level: item.level,
    title: item.title,
    sentences: item.list.sort((a, b) => a.ord - b.ord || a.i - b.i).map(x => x.en)
  }));
}
async function fetchBooks(url) {
  if (!url) return [SAMPLE_BOOK];
  let text;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    text = await res.text();
  } catch (e) {
    throw new Error('책 목록을 가져오지 못했어요. 시트를 "웹에 게시(CSV)"했는지 확인해 주세요.');
  }
  const list = buildBooks(parseCsv(text));
  if (!list.length) throw new Error('책 목록을 찾지 못했어요. 시트 열 순서를 확인해 주세요.');
  return list;
}

// ---------- 오디오 출력 ----------
function ensureOut() {
  if (!outCtx) outCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
  if (outCtx.state === 'suspended') outCtx.resume();
  return outCtx;
}
function warmUpAudio() {
  const ctx = ensureOut();
  try {
    const silentBuf = ctx.createBuffer(1, 1200, 24000);
    const src = ctx.createBufferSource();
    src.buffer = silentBuf;
    src.connect(ctx.destination);
    src.start(ctx.currentTime);
  } catch (e) {}
}
function playFanfare() {
  const ctx = ensureOut();
  const notes = [523.25, 659.25, 783.99, 1046.50];
  const now = ctx.currentTime + 0.02;
  notes.forEach((freq, idx) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now + idx * 0.11);
    gain.gain.setValueAtTime(0.001, now + idx * 0.11);
    gain.gain.exponentialRampToValueAtTime(0.18, now + idx * 0.11 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.11 + (idx === 3 ? 0.55 : 0.22));
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now + idx * 0.11);
    osc.stop(now + idx * 0.11 + (idx === 3 ? 0.6 : 0.25));
  });
}
function flushCaption() {
  if (!teacherText || wordMode || suppressCaption) return;
  const cap = $('caption');
  cap.textContent = teacherText;
  cap.classList.add('show');
}
function scheduleFloat32Chunk(f32) {
  const ctx = ensureOut();
  const buf = ctx.createBuffer(1, f32.length, 24000);
  buf.getChannelData(0).set(f32);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  const now = ctx.currentTime;
  if (!firstAudioStarted || playAt < now) playAt = now + 0.03;
  const startAt = playAt;
  src.start(startAt);
  playAt += buf.duration;

  if (!firstAudioStarted) {
    firstAudioStarted = true;
    const delayMs = Math.max(0, (startAt - now) * 1000);
    clearTimeout(captionTimer);
    captionTimer = setTimeout(() => { flushCaption(); updateVisualState(true); }, delayMs);
  } else {
    flushCaption();
    updateVisualState(true);
  }

  sources.push(src);
  src.onended = () => {
    sources = sources.filter(s => s !== src);
    if (!sources.length) {
      firstAudioStarted = false;
      updateVisualState(false);
    }
  };
}
function playPcm(b64) {
  const bin = atob(b64), len = bin.length >> 1, f = new Float32Array(len);
  for (let i = 0; i < len; i++) {
    let v = bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8);
    if (v >= 0x8000) v -= 0x10000;
    f[i] = v / 32768;
  }
  if (activeCacheKey) currentTurnChunks.push(f);
  scheduleFloat32Chunk(f);
}
function playCachedChunks(chunks, triggerAutoNext = false) {
  stopPlayback();
  firstAudioStarted = false;
  if (outCtx) playAt = outCtx.currentTime;
  for (const f of chunks) {
    scheduleFloat32Chunk(f);
  }
  if (triggerAutoNext && autoReadMode && index >= 0 && !finished && !wordMode) {
    scheduleNextStep(1500);
  }
}
function stopPlayback() {
  clearTimeout(autoReadTimer);
  clearTimeout(captionTimer);
  sources.forEach(s => { try { s.stop(); } catch (e) {} });
  sources = [];
  firstAudioStarted = false;
  if (outCtx) playAt = outCtx.currentTime;
  updateVisualState(false);
}

// ---------- 마이크 + 소음 게이트 + 시각 음량 피드백 ----------
async function startMic() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    inCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    const src = inCtx.createMediaStreamSource(micStream);
    micNode = inCtx.createScriptProcessor(4096, 1, 1);
    micNode.onaudioprocess = e => {
      const canListen = isMicListeningNow();
      const input = e.inputBuffer.getChannelData(0);
      let sum = 0;
      for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
      const rms = Math.sqrt(sum / input.length);

      if (canListen) {
        const scale = Math.min(1.24, 1.04 + rms * 2.2);
        $('teacherWrap').style.setProperty('--mic-scale', scale.toFixed(3));
      } else {
        $('teacherWrap').style.setProperty('--mic-scale', '1');
        return;
      }

      const nowMs = performance.now();
      if (cfg.micMode === 'always') {
        if (rms > 0.016) voiceActiveUntil = nowMs + 950;
        if (nowMs > voiceActiveUntil) return;
      }

      const out = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      const bytes = new Uint8Array(out.buffer);
      let bin = '';
      for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      send({ realtimeInput: { audio: { data: btoa(bin), mimeType: 'audio/pcm;rate=16000' } } });
    };
    src.connect(micNode);
    micNode.connect(inCtx.destination);
    return true;
  } catch (e) {
    stopMic();
    return false;
  }
}
function stopMic() {
  if (micNode) { try { micNode.disconnect(); } catch (e) {} micNode.onaudioprocess = null; micNode = null; }
  if (inCtx) { try { inCtx.close(); } catch (e) {} inCtx = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
}
function isMicListeningNow() {
  if (!connected || !setupDone || introPending || sources.length || turnInFlight || autoReadMode) return false;
  if (cfg.micMode === 'always' || cfg.micMode === 'toggle') return micOn;
  return pushing;
}

// ---------- Gemini Live 연결 ----------
function wsUrl(key) {
  return `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${encodeURIComponent(key)}`;
}
function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }
function setupMessage() {
  return { setup: {
    model: 'models/' + MODEL,
    generationConfig: {
      responseModalities: ['AUDIO'],
      speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: (VOICES[cfg.voice] || VOICES.female).voice } } }
    },
    systemInstruction: { parts: [{ text: buildSystemPrompt() }] },
    tools: [{
      functionDeclarations: [
        {
          name: 'move_to_next_sentence',
          description: '아이가 방금 들은 영어 문장을 따라 읽었을 때, 칭찬을 한 뒤 자동으로 다음 문장(또는 완독 화면)으로 넘어가기 위해 호출합니다.'
        },
        {
          name: 'show_word_meaning',
          description: '아이가 특정 영어 단어를 눌렀을 때, 해당 단어의 짧은 한국어 뜻을 카드 화면에 텍스트로 보여주기 위해 호출합니다.',
          parameters: {
            type: 'OBJECT',
            properties: {
              word: { type: 'STRING', description: '요청된 영어 단어' },
              meaning: { type: 'STRING', description: '문맥에 맞는 쉬운 한국어 뜻 (1~3단어 이내, 예: 바다표범)' }
            },
            required: ['word', 'meaning']
          }
        }
      ]
    }],
    inputAudioTranscription: {},
    outputAudioTranscription: {}
  } };
}
function canUse() { return connected && setupDone && !introPending && !!book; }

async function startSession(preserveState = false) {
  if (!cfg.apiKey.trim()) { openSettings('먼저 API 키를 넣어 주세요.'); return; }
  const savedIdx = preserveState ? index : -1;
  const savedFin = preserveState ? finished : false;
  silentReconnect = preserveState;
  closeSession(preserveState);
  index = savedIdx;
  finished = savedFin;

  warmUpAudio();
  requestWakeLock();
  if (!preserveState) {
    setPhase('loading');
    setTurnBanner('선생님을 부르는 중이에요...', 'talking');
  }
  if (!micStream) {
    const micOk = await startMic();
    micOn = micOk && cfg.micMode === 'always';
    if (!micOk && !preserveState) setTurnBanner('마이크 없이 듣기 모드로 시작해요', 'auto');
  } else {
    micOn = cfg.micMode === 'always';
  }

  const sock = new WebSocket(wsUrl(cfg.apiKey.trim()));
  ws = sock;
  sock.onopen = () => {
    if (ws !== sock) return;
    connected = true;
    reconnectAttempts = 0;
    turnCountInSession = 0;
    sock.send(JSON.stringify(setupMessage()));
    renderDock();
  };
  sock.onmessage = async ev => {
    if (ws !== sock) return;
    let raw = ev.data;
    if (raw instanceof Blob) raw = await raw.text();
    let msg;
    try { msg = JSON.parse(raw); } catch (e) { return; }
    handle(msg);
  };
  sock.onerror = () => { if (ws === sock && !silentReconnect) fail('연결에 실패했어요. 인터넷과 API 키를 확인해 주세요.'); };
  sock.onclose = e => {
    if (ws !== sock) return;
    connected = false;
    setupDone = false;
    if (phase === 'ready' && reconnectAttempts < 2 && e.code !== 1000) {
      reconnectAttempts += 1;
      setTurnBanner('잠시 연결을 다시 잇고 있어요...', 'talking');
      setTimeout(() => {
        if (phase === 'ready' && !connected) startSession(true);
      }, 900);
      return;
    }
    fail('연결이 끊겼어요. 시작하기를 다시 눌러 주세요. (코드 ' + e.code + ')');
  };
}

function closeSession(keepProgress = false) {
  const s = ws;
  ws = null; connected = false; setupDone = false; introPending = false; pendingAutoNext = false;
  pendingTurns = 0; turnInFlight = false; activeCacheKey = ''; currentTurnChunks = [];
  if (!keepProgress) {
    index = -1;
    finished = false;
    audioCache.clear();
    selectedWord = ''; selectedWordMeaning = ''; wordMode = false;
    stopMic();
    releaseWakeLock();
  }
  clearTimeout(introTimer);
  clearTimeout(autoReadTimer);
  clearTimeout(captionTimer);
  pushing = false;
  if (!keepProgress) micOn = false;
  if (s) { try { s.close(1000); } catch (e) {} }
  stopPlayback();
  teacherText = '';
  $('caption').classList.remove('show');
  $('caption').textContent = '';
  $('childLine').textContent = '';
}

function fail(msg) {
  silentReconnect = false;
  closeSession(false);
  setPhase('splash');
  $('splashMsg').textContent = msg;
}

function maybeRefreshSession() {
  if (turnCountInSession >= MAX_TURNS_BEFORE_REFRESH && !sources.length && !turnInFlight && connected && phase === 'ready') {
    turnCountInSession = 0;
    startSession(true);
  }
}

function scheduleNextStep(delayAfterAudioMs) {
  const waitAndGo = () => {
    if (!pendingAutoNext && !autoReadMode) return;
    if (sources.length > 0 || turnInFlight) {
      autoReadTimer = setTimeout(waitAndGo, 150);
      return;
    }
    pendingAutoNext = false;
    autoReadTimer = setTimeout(() => {
      if (canUse() && index >= 0 && !finished) go(1);
    }, delayAfterAudioMs);
  };
  autoReadTimer = setTimeout(waitAndGo, 200);
}

function handle(msg) {
  if (msg.error) return fail('선생님 연결에 문제가 생겼어요: ' + (msg.error.message || '알 수 없는 오류'));
  if (msg.setupComplete) {
    setupDone = true;
    if (silentReconnect) {
      silentReconnect = false;
      setPhase('ready');
      updateVisualState(false);
      return;
    }
    sayIntro();
    return;
  }

  const isStaleTurn = pendingTurns > 1;

  if (msg.toolCall && Array.isArray(msg.toolCall.functionCalls)) {
    const responses = [];
    for (const fc of msg.toolCall.functionCalls) {
      if (fc.name === 'move_to_next_sentence') {
        if (!isStaleTurn) pendingAutoNext = true;
        responses.push({ id: fc.id, name: fc.name, response: { result: 'ok' } });
      } else if (fc.name === 'show_word_meaning') {
        const args = fc.args || {};
        if (!isStaleTurn && args.meaning) {
          selectedWordMeaning = String(args.meaning).trim();
          if (activeCacheKey) {
            const existing = audioCache.get(activeCacheKey) || { chunks: [] };
            existing.meaning = selectedWordMeaning;
            audioCache.set(activeCacheKey, existing);
          }
          renderWordMeaningBox();
        }
        responses.push({ id: fc.id, name: fc.name, response: { result: 'ok' } });
      }
    }
    if (responses.length > 0) send({ toolResponse: { functionResponses: responses } });
    return;
  }

  const sc = msg.serverContent;
  if (!sc) return;

  if (sc.interrupted) {
    pendingAutoNext = false;
    if (pendingTurns > 0) pendingTurns -= 1;
    turnInFlight = pendingTurns > 0;
    stopPlayback();
  }

  if (pendingTurns > 1) {
    if (sc.turnComplete) {
      pendingTurns = Math.max(0, pendingTurns - 1);
      turnInFlight = pendingTurns > 0;
    }
    return;
  }

  if (sc.inputTranscription && sc.inputTranscription.text) {
    $('childLine').textContent = '내 목소리: ' + sc.inputTranscription.text;
  }
  if (sc.outputTranscription && sc.outputTranscription.text) {
    if (newTurn) { teacherText = ''; newTurn = false; }
    teacherText += sc.outputTranscription.text;
    if (firstAudioStarted) flushCaption();
  }
  for (const part of (sc.modelTurn && sc.modelTurn.parts) || []) {
    if (part.inlineData && String(part.inlineData.mimeType || '').startsWith('audio/pcm')) {
      playPcm(part.inlineData.data);
    }
  }
  if (sc.turnComplete) {
    pendingTurns = Math.max(0, pendingTurns - 1);
    turnInFlight = pendingTurns > 0;
    turnCountInSession += 1;

    if (activeCacheKey && currentTurnChunks.length > 0) {
      const prev = audioCache.get(activeCacheKey) || {};
      audioCache.set(activeCacheKey, {
        chunks: currentTurnChunks.slice(),
        meaning: prev.meaning || selectedWordMeaning || ''
      });
    }
    activeCacheKey = '';
    currentTurnChunks = [];

    if (teacherText && !firstAudioStarted) flushCaption();
    newTurn = true;
    $('childLine').textContent = '';

    if (cfg.micMode === 'toggle' && micOn && !wordMode && !suppressCaption) {
      micOn = false;
      renderDock();
    }

    if (introPending) {
      introPending = false;
      clearTimeout(introTimer);
      setPhase('ready');
      if (autoReadMode) startBook();
      else setTurnBanner('책 읽기 시작을 눌러 주세요', 'auto');
    } else if (pendingAutoNext) {
      scheduleNextStep(450);
    } else if (autoReadMode && index >= 0 && !finished && !wordMode) {
      scheduleNextStep(1500);
    } else {
      updateVisualState(sources.length > 0);
      if (!sources.length) maybeRefreshSession();
    }
  }
}

function sendText(text, isWordReq = false, cacheKey = '', hideCap = false) {
  clearTimeout(autoReadTimer);
  pendingTurns += 1;
  turnInFlight = true;
  activeCacheKey = cacheKey;
  currentTurnChunks = [];
  wordMode = isWordReq;
  suppressCaption = hideCap;
  teacherText = ''; newTurn = false; firstAudioStarted = false;
  $('caption').classList.remove('show');
  $('caption').textContent = '';
  reqSeq += 1;
  const v = VOICES[cfg.voice] || VOICES.female;
  const sp = (SPEEDS[cfg.speed] || SPEEDS[2]).text;
  const voiceTag = `[#${reqSeq} | 고정화자:${v.voice}(${v.label}) | 고정속도:${sp}]`;
  send({ clientContent: { turns: [{ role: 'user', parts: [{ text: `${voiceTag} ${text}` }] }], turnComplete: true } });
}

function sayIntro() {
  const nm = cfg.childName.trim();
  const greet = pickTimeGreeting(nm ? nm + '! ' : '');
  const intro = pick(INTROS)(book ? book.title : '오늘의 책');
  introPending = true;
  setPhase('loading');

    if (introPending) {
      introPending = false;
      pendingTurns = 0;
      turnInFlight = false;
      setPhase('ready');
      if (autoReadMode) startBook();
      else setTurnBanner('책 읽기 시작을 눌러 주세요', 'auto');
    }

// ---------- 계속 읽기 모드 토글 ----------
function toggleAutoRead() {
  autoReadMode = !autoReadMode;
  clearTimeout(autoReadTimer);
  pendingAutoNext = false;
  wordMode = false;

  if (autoReadMode) {

function renderAutoButton() {

// ---------- 읽기 흐름 ----------
function clearWordSelection() {
  selectedWord = '';
  selectedWordMeaning = '';
  wordMode = false;
}
function startBook() {
  if (!canUse()) return;
  finished = false;
  index = 0;
  clearWordSelection();
  readSentence();
}
function readSentence(forceFresh = false) {
  if (!canUse() || index < 0 || finished) return;
  stopPlayback();
  clearWordSelection();
  const sentence = book.sentences[index];
  const cacheKey = `S:${cfg.voice}:${cfg.speed}:${sentence}`;
  const cached = audioCache.get(cacheKey);
  if (!forceFresh && cached && cached.chunks && cached.chunks.length > 0) {
    suppressCaption = true;
    $('caption').classList.remove('show');
    renderAll();
    playCachedChunks(cached.chunks, true);
    return;
  }
  sendText(`READ_SENTENCE: ${sentence}`, false, cacheKey, true);
  renderAll();
}
function readWord(cleanWord, displayWord) {
  if (!canUse() || index < 0 || finished || !cleanWord) return;
  stopPlayback();
  if (autoReadMode) {
    autoReadMode = false;
    renderAutoButton();
    renderDock();
  }
  const sentence = book.sentences[index];
  const cacheKey = `W:${cfg.voice}:${cfg.speed}:${cfg.wordKoMode}:${sentence}:${cleanWord.toLowerCase()}`;
  const cached = audioCache.get(cacheKey);
  selectedWord = displayWord;
  wordMode = true;

  if (cached && cached.chunks && cached.chunks.length > 0) {
    selectedWordMeaning = cached.meaning || '';
    renderCard();
    playCachedChunks(cached.chunks, false);
    return;
  }

  selectedWordMeaning = '뜻 찾는 중...';
  renderCard();
  sendText(`READ_WORD: "${cleanWord}" (문맥: "${sentence}")`, true, cacheKey, true);
}
function speakWordMeaning() {
  if (!canUse() || !selectedWordMeaning || selectedWordMeaning === '뜻 찾는 중...') return;
  stopPlayback();
  const cacheKey = `WK:${cfg.voice}:${selectedWordMeaning}`;
  const cached = audioCache.get(cacheKey);
  if (cached && cached.chunks && cached.chunks.length > 0) {
    playCachedChunks(cached.chunks, false);
    return;
  }
  sendText(`SPEAK_KO: ${selectedWordMeaning}`, true, cacheKey, true);
}
function finishBook() {
  if (!canUse()) return;
  stopPlayback();
  clearWordSelection();
  finished = true;
  playFanfare();
  renderAll();
  $('teacherWrap').classList.add('happy');
  const nm = cfg.childName.trim();
  const who = nm ? `${nm}! ` : '';
  setTimeout(() => {
    if (!finished) return;
    sendText(`CELEBRATE: ${who}우와, "${book.title}" 책을 끝까지 다 읽었어! 정말 최고야, 참 잘했어!`, false, '', false);
  }, 650);
}
function go(delta) {
  if (!canUse()) return;
  pendingAutoNext = false;
  clearTimeout(autoReadTimer);
  clearWordSelection();
  $('teacherWrap').classList.remove('happy');
  if (finished) {
    if (delta < 0) {
      finished = false;
      index = book.sentences.length - 1;
      readSentence();
    }
    return;
  }
  if (index < 0) { if (delta > 0) startBook(); return; }
  const next = index + delta;
  if (next < 0) {
    setTurnBanner('첫 문장이에요', 'auto');
    return;
  }
  if (next >= book.sentences.length) {
    finishBook();
    return;
  }
  index = next;
  readSentence();
}
function meaning() {
  if (!canUse() || index < 0 || finished) return;
  stopPlayback();
  clearWordSelection();
  if (autoReadMode) {
    autoReadMode = false;
    renderAutoButton();
  }
  const sentence = book.sentences[index];
  const cacheKey = `M:${cfg.voice}:${sentence}`;
  const cached = audioCache.get(cacheKey);
  if (cached && cached.chunks && cached.chunks.length > 0) {
    renderAll();
    playCachedChunks(cached.chunks, false);
    return;
  }
  sendText(`MEANING: "${sentence}"`, false, cacheKey, false);
  renderAll();
}

// ---------- 화면 및 시각 피드백 ----------
function setPhase(p) {
  phase = p;
  $('splash').classList.toggle('hide', p !== 'splash');
  renderAll();
}
function setTurnBanner(text, mode) {
  const pill = $('turnPill');
  const label = $('turnText');
  if (!text) {
    pill.className = 'turn-pill hidden';
    label.textContent = '';
    return;
  }
  pill.className = 'turn-pill ' + (mode || '');
  label.textContent = text;
}
function updateVisualState(isTalking) {
  const wrap = $('teacherWrap');
  const card = $('card');
  wrap.classList.toggle('talking', isTalking);
  wrap.classList.toggle('happy', finished);

  const listening = !isTalking && isMicListeningNow() && index >= 0 && !finished;
  wrap.classList.toggle('listening', listening);
  card.classList.toggle('listening-active', listening);

  if (!connected || !setupDone || introPending) return;
  if (isTalking) {
    if (wordMode) setTurnBanner(`"${selectedWord}" 발음을 들려주고 있어요`, 'talking');
    else if (autoReadMode) setTurnBanner('선생님이 계속 읽어주고 있어요', 'talking');
    else setTurnBanner('선생님 목소리를 잘 들어 봐요', 'talking');
  } else if (finished) {
    setTurnBanner('책을 끝까지 다 읽었어요!', 'talking');
  } else if (autoReadMode && index >= 0 && !wordMode) {
    setTurnBanner('잠시 뒤 다음 문장을 읽어요...', 'auto');
  } else if (listening) {
    setTurnBanner('내 차례예요! 크게 따라 말해 봐요', 'listening');
  } else if (index >= 0) {
    if (cfg.micMode === 'toggle') setTurnBanner('말하기 버튼을 눌러 따라 말해 봐요', 'auto');
    else if (cfg.micMode === 'push') setTurnBanner('말하기 버튼을 누른 채 말해 봐요', 'auto');
    else setTurnBanner('마이크가 꺼져 있어요', 'auto');
  } else {
    setTurnBanner('책 읽기 시작을 눌러 주세요', 'auto');
  }
}
function renderAll() {
  $('bookTitle').textContent = book ? book.title : '책을 골라 주세요';
  renderAutoButton();
  renderCard();
  renderDots();
  renderDock();
  updateVisualState(sources.length > 0);
}
function renderDots() {
  const wrap = $('dots');
  if (!book || phase === 'loading' || index < 0) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = book.sentences.map((_, i) => {
    const cls = finished || i < index ? 'dot done' : (i === index ? 'dot cur' : 'dot');
    return `<span class="${cls}"></span>`;
  }).join('');
}
function renderWordMeaningBox() {
  const box = $('wordMeaningBox');
  if (!box) return;
  if (!selectedWord) {
    box.classList.remove('show');
    box.innerHTML = '';
    return;
  }
  const cleanLabel = selectedWord.replace(/^[^a-zA-Z0-9']+|[^a-zA-Z0-9']+$/g, '') || selectedWord;
  box.classList.add('show');
  box.innerHTML = `<button type="button" class="word-meaning-pill" data-act="speak-meaning" title="눌러서 한글 뜻 듣기"><span class="spk-ic">${speakerIconSvg()}</span><strong>${esc(cleanLabel)}</strong> : ${esc(selectedWordMeaning)}</button>`;
}
function renderCard() {
  const el = $('card');
  if (!book) { el.className = 'card empty'; el.innerHTML = '<div class="en small">설정에서 책을 골라 주세요</div>'; return; }
  if (phase === 'loading') { el.className = 'card empty'; el.innerHTML = '<div class="en small">선생님이 인사하고 있어요</div><div class="hint">잠시만 기다려 주세요</div>'; return; }
  if (finished) {
    el.className = 'card finish';
    el.innerHTML = `
      <div class="trophy-badge" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="#ff9f00" stroke="#b25e00" stroke-width="1.8" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </div>
      <div class="finish-title">참 잘했어요! 책 읽기 끝!</div>
      <div class="finish-sub">"${esc(book.title)}" 완독 성공!</div>
      <div class="finish-actions">
        <button type="button" class="finish-btn again" data-act="again">처음부터 다시</button>
        <button type="button" class="finish-btn other" data-act="other">다른 책 고르기</button>
      </div>`;
    return;
  }
  if (index < 0) {
    el.className = 'card empty';
    el.innerHTML = `<div class="book-big">${esc(book.title)}</div><button type="button" class="start-book" data-act="start">책 읽기 시작</button>`;
    return;
  }
  el.className = 'card' + (autoReadMode ? ' auto-active' : '');
  const tokens = book.sentences[index].trim().split(/\s+/);
  const wordsHtml = tokens.map(tok => {
    const clean = tok.replace(/^[^a-zA-Z0-9']+|[^a-zA-Z0-9']+$/g, '');
    const isSel = selectedWord && selectedWord === tok;
    return `<span class="word-btn${isSel ? ' active' : ''}" data-word="${esc(clean || tok)}" data-raw="${esc(tok)}">${esc(tok)}</span>`;
  }).join('');
  el.innerHTML = `<div class="en">${wordsHtml}</div><div class="word-meaning-box" id="wordMeaningBox"></div><div class="hint">단어를 누르면 발음과 뜻이 나와요</div>`;
  renderWordMeaningBox();
}
function renderDock() {
  const ok = canUse();
  $('prevBtn').disabled = !(ok && (finished || index > 0));
  $('nextBtn').disabled = !(ok && !finished && (index < 0 || index <= book.sentences.length - 1));
  $('meaningBtn').disabled = !(ok && !finished && index >= 0);
  $('rereadBtn').disabled = !(ok && !finished && index >= 0);
  $('micBtn').disabled = !connected || autoReadMode;
  const on = !autoReadMode && (cfg.micMode === 'push' ? pushing : micOn);
  $('micBtn').classList.toggle('on', on);
  $('micLabel').textContent = !connected ? '말하기'
    : autoReadMode ? '듣기 모드'
    : cfg.micMode === 'always' ? (micOn ? '듣는 중' : '마이크 꺼짐')
    : cfg.micMode === 'toggle' ? (micOn ? '말하는 중' : '눌러서 말해요')
    : (pushing ? '말하는 중' : '누르고 말해요');
}

// ---------- 부모 잠금 (Parental Gate) ----------
let gateAnswer = 0;
function openParentalGate() {
  if (!cfg.apiKey.trim()) { openSettings(); return; }
  const a = 3 + Math.floor(Math.random() * 7);
  const b = 3 + Math.floor(Math.random() * 7);
  gateAnswer = a + b;
  $('gateQuestion').textContent = `${a} + ${b} = ?`;
  $('gateErr').textContent = '';
  const opts = new Set([gateAnswer]);
  while (opts.size < 4) {
    const cand = Math.max(2, gateAnswer + Math.floor(Math.random() * 9) - 4);
    opts.add(cand);
  }
  const shuffled = [...opts].sort(() => Math.random() - 0.5);
  const grid = $('gateOptions');
  grid.innerHTML = '';
  shuffled.forEach(num => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'gate-opt';
    btn.textContent = num;
    btn.addEventListener('click', () => {
      if (num === gateAnswer) {
        closeParentalGate();
        openSettings();
      } else {
        $('gateErr').textContent = '어른과 함께 다시 풀어 주세요.';
      }
    });
    grid.appendChild(btn);
  });
  $('gateModal').classList.add('open');
}
function closeParentalGate() { $('gateModal').classList.remove('open'); }

// ---------- 설정창 ----------
function openSettings(msg = '') {
  fillForm();
  $('settingsMsg').textContent = msg;
  $('testResult').textContent = '';
  $('testResult').className = 'res';
  $('settingsModal').classList.add('open');
}
function closeSettings() { $('settingsModal').classList.remove('open'); }
function fillForm() {
  $('apiKeyInput').value = cfg.apiKey;
  $('sheetInput').value = cfg.sheetUrl;
  $('childInput').value = cfg.childName;
  selVoice = cfg.voice; selSpeed = cfg.speed; selMic = cfg.micMode; selWordKo = cfg.wordKoMode || 'tap';
  paintSegs();
  renderBookSelect();
}
function renderBookSelect() {
  const sel = $('bookSelect');
  sel.innerHTML = '';
  books.forEach(b => {
    const o = document.createElement('option');
    o.value = b.title;
    const prefix = b.level && b.level !== '전체' ? `[${b.level}] ` : '';
    o.textContent = `${prefix}${b.title} (${b.sentences.length}문장)`;
    sel.appendChild(o);
  });
  if (book) sel.value = book.title;
}
function paintSegs() {
  document.querySelectorAll('[data-voice]').forEach(b => b.classList.toggle('on', b.dataset.voice === selVoice));
  document.querySelectorAll('[data-speed]').forEach(b => b.classList.toggle('on', Number(b.dataset.speed) === selSpeed));
  document.querySelectorAll('[data-mic]').forEach(b => b.classList.toggle('on', b.dataset.mic === selMic));
  document.querySelectorAll('[data-wordko]').forEach(b => b.classList.toggle('on', b.dataset.wordko === selWordKo));
}
function showTest(text, bad) {
  const o = $('testResult');
  o.textContent = text;
  o.className = 'res ' + (bad ? 'bad' : 'ok');
}
function testConnection() {
  const key = $('apiKeyInput').value.trim();
  if (!key) { showTest('API 키를 먼저 넣어 주세요.', true); return; }
  showTest('연결을 확인하는 중...', false);
  let done = false, t = null, timer = null;
  const finish = (text, bad) => {
    if (done) return;
    done = true;
    clearTimeout(timer);
    if (t) { try { t.close(); } catch (e) {} }
    showTest(text, bad);
  };
  t = new WebSocket(wsUrl(key));
  timer = setTimeout(() => finish('응답이 없어요. 인터넷 연결을 확인해 주세요.', true), 10000);
  t.onopen = () => t.send(JSON.stringify({ setup: { model: 'models/' + MODEL, generationConfig: { responseModalities: ['AUDIO'] } } }));
  t.onmessage = async ev => {
    let raw = ev.data;
    if (raw instanceof Blob) raw = await raw.text();
    const m = JSON.parse(raw);
    if (m.setupComplete) finish('연결 성공! 선생님 목소리를 쓸 수 있어요.', false);
    else if (m.error) finish('연결 실패: ' + (m.error.message || '키나 모델 권한을 확인해 주세요.'), true);
  };
  t.onerror = () => finish('연결에 실패했어요. 키와 인터넷을 확인해 주세요.', true);
  t.onclose = e => finish('연결이 닫혔어요 (코드 ' + e.code + ').', true);
}
async function saveSettings() {
  const before = { key: cfg.apiKey, voice: cfg.voice, speed: cfg.speed, mic: cfg.micMode, sheet: cfg.sheetUrl, wordKo: cfg.wordKoMode };
  cfg.apiKey = $('apiKeyInput').value.trim();
  cfg.sheetUrl = $('sheetInput').value.trim();
  cfg.childName = $('childInput').value.trim();
  cfg.voice = selVoice; cfg.speed = selSpeed; cfg.micMode = selMic; cfg.wordKoMode = selWordKo;
  if (cfg.sheetUrl !== before.sheet || !books.length) {
    try { books = await fetchBooks(cfg.sheetUrl); }
    catch (e) { saveCfg(); $('settingsMsg').textContent = e.message; return; }
  }
  const chosen = $('bookSelect').value;
  const changed = !book || chosen !== book.title;
  book = books.find(b => b.title === chosen) || books[0];
  cfg.bookTitle = book.title;
  if (changed) { index = -1; finished = false; clearWordSelection(); }
  saveCfg();
  const needRestart = connected && (cfg.apiKey !== before.key || cfg.voice !== before.voice || cfg.speed !== before.speed || cfg.micMode !== before.mic || cfg.wordKoMode !== before.wordKo);
  closeSettings();
  audioCache.clear();
  if (needRestart) {
    closeSession(false);
    setPhase('splash');
    $('splashMsg').textContent = '설정을 적용했어요. 시작하기를 누르면 선생님이 새로 인사해요.';
    return;
  }
  renderAll();
}
async function reloadBooks() {
  const url = $('sheetInput').value.trim();
  $('settingsMsg').textContent = '책 목록을 불러오는 중...';
  try {
    books = await fetchBooks(url);
    renderBookSelect();
    $('settingsMsg').textContent = `책 ${books.length}권을 불러왔어요.`;
  } catch (e) {
    $('settingsMsg').textContent = e.message;
  }
}

// ---------- 책장 모달 ----------
let activeSeriesFilter = '';
let activeLevelFilter = '';
function openBookList() {
  if (book) { activeSeriesFilter = book.series || ''; activeLevelFilter = book.level || ''; }
  renderBookShelf();
  $('bookListModal').classList.add('open');
}
function renderBookShelf() {
  const seriesRow = $('seriesFilterRow');
  const levelRow = $('levelFilterRow');
  const grid = $('bookListGrid');
  seriesRow.innerHTML = ''; levelRow.innerHTML = ''; grid.innerHTML = '';

  const allSeries = [...new Set(books.map(b => b.series))];
  if (!activeSeriesFilter || !allSeries.includes(activeSeriesFilter)) activeSeriesFilter = allSeries[0] || '';
  allSeries.forEach(s => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'filter-chip' + (s === activeSeriesFilter ? ' on' : '');
    chip.textContent = s;
    chip.addEventListener('click', () => {
      activeSeriesFilter = s;
      const levelsInSeries = [...new Set(books.filter(b => b.series === s).map(b => b.level))];
      activeLevelFilter = levelsInSeries[0] || '';
      renderBookShelf();
    });
    seriesRow.appendChild(chip);
  });

  const booksInSeries = books.filter(b => b.series === activeSeriesFilter);
  const levels = [...new Set(booksInSeries.map(b => b.level))];
  if (!activeLevelFilter || !levels.includes(activeLevelFilter)) activeLevelFilter = levels[0] || '';
  levels.forEach(lvl => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'filter-chip lvl' + (lvl === activeLevelFilter ? ' on' : '');
    chip.textContent = lvl;
    chip.addEventListener('click', () => { activeLevelFilter = lvl; renderBookShelf(); });
    levelRow.appendChild(chip);
  });

  booksInSeries.filter(b => b.level === activeLevelFilter).forEach(b => {
    const btn = document.createElement('button');
    btn.type = 'button';
    const isCurrent = book && b.title === book.title;
    btn.className = 'book-item' + (isCurrent ? ' active' : '');
    const badgeText = (isCurrent && finished) ? `완독! · ${b.sentences.length}문장` : `${b.sentences.length}문장`;
    btn.innerHTML = `<div><div class="book-item-sub">${esc(b.series)} · ${esc(b.level)}</div><div class="book-item-title">${esc(b.title)}</div></div><span class="book-item-meta">${badgeText}</span>`;
    btn.addEventListener('click', () => {
      stopPlayback();
      pendingAutoNext = false;
      clearWordSelection();
      $('teacherWrap').classList.remove('happy');
      book = b;
      cfg.bookTitle = b.title;
      index = -1;
      finished = false;
      saveCfg();
      closeBookList();
      renderAll();
      if (turnCountInSession >= 8 && connected) startSession(true);
      if (autoReadMode && canUse()) startBook();
      else setTurnBanner('책 읽기 시작을 눌러 주세요', 'auto');
    });
    grid.appendChild(btn);
  });
}
function closeBookList() { $('bookListModal').classList.remove('open'); }

// ---------- 이벤트 ----------
$('splashStart').addEventListener('click', () => startSession(false));
$('autoModeBtn').addEventListener('click', toggleAutoRead);
$('settingsBtn').addEventListener('click', openParentalGate);
$('closeGateBtn').addEventListener('click', closeParentalGate);
$('gateModal').addEventListener('click', e => { if (e.target === $('gateModal')) closeParentalGate(); });
$('closeSettingsBtn').addEventListener('click', closeSettings);
$('settingsModal').addEventListener('click', e => { if (e.target === $('settingsModal')) closeSettings(); });
$('testBtn').addEventListener('click', testConnection);
$('reloadBtn').addEventListener('click', reloadBooks);
$('saveBtn').addEventListener('click', saveSettings);
$('stopTeacherBtn').addEventListener('click', () => { closeSession(false); closeSettings(); setPhase('splash'); $('splashMsg').textContent = ''; });
document.querySelectorAll('[data-voice]').forEach(b => b.addEventListener('click', () => { selVoice = b.dataset.voice; paintSegs(); }));
document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => { selSpeed = Number(b.dataset.speed); paintSegs(); }));
document.querySelectorAll('[data-mic]').forEach(b => b.addEventListener('click', () => { selMic = b.dataset.mic; paintSegs(); }));
document.querySelectorAll('[data-wordko]').forEach(b => b.addEventListener('click', () => { selWordKo = b.dataset.wordko; paintSegs(); }));
$('closeBookListBtn').addEventListener('click', closeBookList);
$('bookListModal').addEventListener('click', e => { if (e.target === $('bookListModal')) closeBookList(); });
$('bookPillBtn').addEventListener('click', openBookList);

$('card').addEventListener('click', e => {
  if (e.target.closest('[data-act="start"]') || e.target.closest('[data-act="again"]')) { startBook(); return; }
  if (e.target.closest('[data-act="other"]')) { openBookList(); return; }
  if (e.target.closest('[data-act="speak-meaning"]')) { speakWordMeaning(); return; }
  const wordEl = e.target.closest('.word-btn');
  if (wordEl && index >= 0 && !finished) readWord(wordEl.dataset.word, wordEl.dataset.raw);
});
$('prevBtn').addEventListener('click', () => go(-1));
$('nextBtn').addEventListener('click', () => go(1));
$('meaningBtn').addEventListener('click', meaning);
$('rereadBtn').addEventListener('click', () => readSentence());
$('micBtn').addEventListener('click', () => {
  if (!connected || autoReadMode) return;
  if (cfg.micMode === 'always' || cfg.micMode === 'toggle') {
    micOn = !micOn;
    renderDock();
    updateVisualState(sources.length > 0);
  }
});
$('micBtn').addEventListener('pointerdown', () => {
  if (connected && !autoReadMode && cfg.micMode === 'push') {
    pushing = true;
    renderDock();
    updateVisualState(sources.length > 0);
  }
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => $('micBtn').addEventListener(ev, () => {
  if (cfg.micMode === 'push' && pushing) {
    pushing = false;
    renderDock();
    updateVisualState(sources.length > 0);
  }
}));
$('krFlag').innerHTML = flagKR();
$('usFlag').innerHTML = flagUS();

// ---------- 시작 ----------
async function init() {
  loadCfg();
  let loadErr = '';
  try { books = await fetchBooks(cfg.sheetUrl); }
  catch (e) { books = [SAMPLE_BOOK]; loadErr = e.message + ' (기본 책으로 시작해요)'; }
  book = books.find(b => b.title === cfg.bookTitle) || books[0];
  renderBookSelect();
  renderAll();
  if (loadErr) $('splashMsg').textContent = loadErr;
}
init();
</script>
</body>
</html>
