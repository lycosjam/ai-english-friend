  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; min-width: 320px; height: 100%; overflow: hidden; }
  body {
    position: relative; height: 100dvh; min-height: 460px; overflow: hidden;
    display: flex; flex-direction: column; align-items: stretch;
    color: var(--text-main);
    font-family: Pretendard, "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #dce9d2; user-select: none;
  }
  button, input, textarea { font: inherit; }
  button { -webkit-appearance: none; appearance: none; }

  /* Full-screen forest illustration. All text and controls remain real HTML elements. */
  .scene-backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: linear-gradient(180deg, rgba(20,42,24,.08), rgba(20,42,24,.04) 48%, rgba(25,42,23,.18)), var(--scene-image); background-size: cover; background-position: center 52%; filter: blur(1.35px) saturate(.99); transform: none; }
  .scene-backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,250,236,.04), transparent 22%, transparent 78%, rgba(255,250,236,.05)), linear-gradient(180deg, rgba(25,43,26,.08), transparent 26%, transparent 75%, rgba(25,43,26,.14)); }

  .app-shell { position: relative; z-index: 1; width: min(100%, 1760px); height: 100dvh; min-height: 460px; margin: 0 auto; padding: 0 clamp(12px, 2.2vw, 36px) clamp(10px, 1.5vw, 22px); display: flex; flex-direction: column; gap: clamp(8px, 1.2vh, 16px); }

  /* Top identity strip */
  .header-area { width:100vw; max-width:none; margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw); border-radius:0 0 20px 20px; flex: 0 0 auto; width: 100%; min-height: 66px; padding: 9px 14px; display: flex; align-items: center; justify-content: space-between; gap: 14px; border: 1px solid rgba(255,255,255,.68); border-radius: 22px; background: linear-gradient(115deg, rgba(35,59,35,.985), rgba(46,69,42,.965)); box-shadow: 0 8px 26px rgba(20,36,19,.16), inset 0 1px 0 rgba(255,255,255,.22); backdrop-filter: blur(12px); color: #fffdf3; }
  .brand-lockup { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .avatar-wrap { width: 48px; height: 48px; flex: 0 0 48px; border-radius: 50%; background: linear-gradient(145deg,#f7dca4,#b87535); border: 2px solid rgba(255,246,220,.95); display: grid; place-items: center; box-shadow: 0 4px 12px rgba(0,0,0,.20), inset 0 1px 2px rgba(255,255,255,.65); cursor: pointer; transition: transform .2s, box-shadow .2s; }
  .avatar-wrap svg { width: 34px; height: 34px; }
  .avatar-wrap.speaking { animation: bearPulse 1.15s infinite ease-in-out; box-shadow: 0 0 0 5px rgba(255,213,113,.27), 0 0 22px rgba(255,221,143,.7); }
  .avatar-wrap.listening { box-shadow: 0 0 0 4px rgba(160,220,139,.25); }
  @keyframes bearPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.055); } }
  .brand-copy { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .ai-name-row { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; min-width: 0; }
  .ai-name { font-size: clamp(17px,1.45vw,22px); line-height: 1; letter-spacing: -.035em; font-weight: 850; color: #fff9e8; }
  .ai-badge { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; color: #f8e5b8; border: 1px solid rgba(255,239,199,.38); background: rgba(255,245,219,.12); padding: 4px 8px; border-radius: 999px; }
  .child-tag { font-size: 11px; font-weight: 700; color: #e5f1da; background: rgba(222,240,207,.14); border: 1px solid rgba(236,247,220,.28); padding: 4px 8px; border-radius: 999px; cursor: pointer; }
  .status-wave-row { min-height: 14px; display: flex; align-items: center; gap: 7px; font-size: 11px; color: rgba(250,249,232,.78); font-weight: 600; }
  .status-wave-row.speaking { color: #ffe0a6; } .status-wave-row.listening { color: #d9f6cf; } .status-wave-row.recording { color: #ffd2c7; }
  .wave-bars { display: inline-flex; align-items: center; gap: 2px; height: 12px; }
  .wave-bars span { display:block; width:2.5px; height:4px; border-radius:3px; background:currentColor; }
  .wave-bars.active span:nth-child(1) { animation: barBounce .65s infinite ease-in-out 0s; }
  .wave-bars.active span:nth-child(2) { animation: barBounce .65s infinite ease-in-out .12s; }
  .wave-bars.active span:nth-child(3) { animation: barBounce .65s infinite ease-in-out .24s; }
  .wave-bars.active span:nth-child(4) { animation: barBounce .65s infinite ease-in-out .12s; }
  .wave-bars.active span:nth-child(5) { animation: barBounce .65s infinite ease-in-out 0s; }
  @keyframes barBounce { 0%,100%{height:4px} 50%{height:12px} }

  .top-bar-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 7px; }
  .conn-pill, .settings-btn { min-height: 36px; display: inline-flex; justify-content: center; align-items: center; gap: 7px; border-radius: 999px; padding: 7px 12px; font-size: 11px; font-weight: 750; white-space: nowrap; cursor: pointer; color: #fdf9ee; border: 1px solid rgba(255,255,255,.27); background: rgba(255,255,255,.10); backdrop-filter: blur(8px); }
  .conn-pill.ok { color:#e7f7dd; background:rgba(62,119,69,.72); border-color:rgba(198,233,180,.48); }
  .conn-pill.warn { color:#fff1d7; background:rgba(127,76,36,.65); border-color:rgba(255,220,169,.42); }
  .settings-btn { padding: 8px 15px; background: linear-gradient(180deg,rgba(255,247,226,.22),rgba(255,247,226,.10)); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
  .settings-btn svg, .conn-pill svg { width: 15px; height: 15px; stroke: currentColor; }
  .api-notice-bar { display:none; flex:0 0 auto; width:100%; max-width:none; align-self:stretch; border-radius:0 0 14px 14px; z-index:3; text-align:center; border-radius:12px; padding:8px 12px; color:#fff4d8; background:rgba(120,64,24,.92); border:1px solid rgba(255,221,169,.48); font-size:12px; font-weight:750; cursor:pointer; box-shadow:0 5px 16px rgba(25,36,20,.16); }
  .api-notice-bar.show { display:block; }

  /* Central conversation panel */
  .chat-container { flex: 0 1 clamp(300px, 58vh, 650px); min-height: 260px; width: min(100%, 1040px); max-height: min(62vh, 650px); margin: auto; padding: clamp(16px, 2vw, 28px) clamp(14px, 2.4vw, 34px); display:flex; flex-direction:column; gap: clamp(12px, 1.7vh, 20px); overflow-y:auto; overscroll-behavior:contain; scroll-behavior:smooth; scrollbar-width:thin; scrollbar-color:rgba(107,139,93,.45) transparent; border:1px solid rgba(255,255,255,.76); border-radius: clamp(22px,2.2vw,34px); background: linear-gradient(145deg, rgba(255,253,247,.88), rgba(246,249,238,.76)); box-shadow: 0 18px 50px rgba(28,47,30,.22), inset 0 1px 0 rgba(255,255,255,.92); backdrop-filter: blur(14px) saturate(1.12); }
  .chat-container::-webkit-scrollbar { width:7px; } .chat-container::-webkit-scrollbar-thumb { background:rgba(107,139,93,.28); border-radius:10px; }
  .topic-pill-banner { align-self:center; max-width:100%; padding:8px 17px 8px 38px; border-radius:999px; border:1px solid #d8e3c9; background:linear-gradient(180deg,#f7f9ed,#edf3e2); color:#4e6843; font-size:12px; line-height:1.45; font-weight:800; text-align:center; cursor:pointer; position:relative; box-shadow:0 3px 10px rgba(91,121,75,.08); }
  .topic-pill-banner::before { content:""; position:absolute; left:14px; top:50%; width:12px; height:12px; transform:translateY(-50%); border-radius:50% 50% 50% 0; background:linear-gradient(145deg,#91b978,#4e7a4d); box-shadow:0 0 0 3px rgba(145,185,120,.17); }

  .msg-row { width:100%; display:flex; animation:popIn .22s ease-out; }
  @keyframes popIn { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }
  .msg-row.ai { justify-content:flex-start; }
  .msg-row.user { justify-content:flex-end; }
  .ai-bubble { width:fit-content; max-width:min(88%, 820px); padding:clamp(14px,1.55vw,21px) clamp(16px,1.9vw,25px); display:flex; flex-direction:column; gap:9px; border-radius:23px 23px 23px 7px; background:linear-gradient(145deg,rgba(255,255,255,.99),rgba(255,252,244,.97)); border:1px solid #eadfc9; box-shadow:0 7px 20px rgba(83,75,49,.09), inset 0 1px 0 #fff; }
  .ai-en-text { color:#293b2c; font-size:clamp(19px,2vw,27px); font-weight:820; letter-spacing:-.035em; line-height:1.32; word-break:keep-all; cursor:pointer; }
  .ai-en-text:hover { color:#416b43; }
  .reveal-hint-badge { align-self:flex-start; font-size:11px; color:#85917d; font-weight:650; cursor:pointer; }
  .ai-ko-reveal { display:none; color:#657260; font-size:clamp(13px,1.2vw,15px); font-weight:650; line-height:1.5; padding:9px 12px; background:#f3f5ec; border:1px solid #e4e9d8; border-radius:12px; cursor:pointer; animation:fadeIn .18s ease-out; }
  .ai-ko-reveal.show { display:block; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .repeat-box { margin-top:4px; padding-top:12px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; border-top:1px dashed #d8dfcb; }
  .repeat-signal { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:800; color:#52784b; }

  .mic-center-btn { flex:0 0 clamp(82px,8vw,112px); width:clamp(82px,8vw,112px); height:clamp(82px,8vw,112px); margin:-24px 3px -17px; position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:50%; border:5px solid #fff0c9; color:#fff; background:radial-gradient(circle at 35% 28%,#9fd47e 0%,#54a75d 48%,#27713e 100%); box-shadow:0 0 0 3px rgba(255,219,131,.78),0 7px 19px rgba(34,82,39,.5),inset 0 2px 5px rgba(255,255,255,.55),inset 0 -5px 9px rgba(18,69,34,.32); cursor:pointer; transition:transform .16s ease,filter .16s ease; }

    // 주제별 목표 문형/단어/예시 (DAILY_TOPICS_POOL과 같은 순서) — 부모님이 수정하세요
    const TOPIC_META = [
      { pattern: "I feel ___.", example: "I feel happy.", words: ["happy", "sleepy", "tired"] },
      { pattern: "I ate ___.", example: "I ate an apple.", words: ["apple", "bread", "yummy"] },
      { pattern: "It is ___.", example: "It is sunny.", words: ["sunny", "cloudy", "cold"] },
      { pattern: "I am wearing ___.", example: "I am wearing a blue shirt.", words: ["blue", "red", "shirt"] },
      { pattern: "I like ___.", example: "I like ice cream.", words: ["apple", "strawberry", "ice cream"] },
      { pattern: "I played with ___.", example: "I played with blocks.", words: ["toy", "blocks", "game"] },
      { pattern: "I like ___.", example: "I like puppies.", words: ["puppy", "cat", "lion"] },
      { pattern: "I like the ___.", example: "I like the slide.", words: ["swing", "slide", "fun"] }
    ];
    const MAX_RETRY = 1;
    let sessionTurn = 0, sessionEnded = false, repeatTries = 0;
    let pendingRetry = false, lastMatchHigh = true, lastRepeatScore = 1;

    function currentMeta() {
      const i = DAILY_TOPICS_POOL.findIndex(t => t.prompt === appConfig.dailyTopic);
      return i >= 0 ? TOPIC_META[i] : null;
    }
    function sessionLen() { return appConfig.preset === "test" ? 2 : appConfig.preset === "child2" ? 4 : 6; }

    function updateModeUI() {
      modeToggleBtn.textContent = appConfig.mode === "en" ? "영어 도전 모드" : "한국어 모드";
    }

    function repeatScore(spoken, target) {
      const norm = x => (x || "").toLowerCase().replace(/[^a-z' ]/g, " ").split(/\s+/).filter(Boolean);
      const t = norm(target), sp = new Set(norm(spoken));
      if (!t.length) return 1;
      return t.filter(w => sp.has(w)).length / t.length;
    }

    function buildRetryResponse() {
      const almost = lastRepeatScore >= 0.4;
      return {
        enText: almost ? "Almost! Let's try one more time." : "That's okay! Listen again.",
        signalKo: "한 번 더 해볼까?",
        repeatEn: lastRepeatSentence,
        koSub: almost ? "거의 다 됐어! 한 번만 더 해볼까?" : "괜찮아! 다시 한번 들어보고 따라 해 보자."
      };
    }

    function giveHelp() {
      if (isMicLocked || isAiSpeaking || isRecording) return;
      const m = currentMeta();
      const ex = (expectEnglishRepeat && lastRepeatSentence) || (m ? m.example : "I like it.");
      const turn = { enText: "Let's say it together!", signalKo: "따라 해 볼래?", repeatEn: ex, koSub: "같이 말해 보자! 이렇게 말하면 돼." };
      lastAiResponse = turn;
      expectEnglishRepeat = true;
      lastRepeatSentence = ex;
      repeatTries = 0;
      appendAiBubble(turn);
      speakAiTurn(turn, true);
    }

    function extraPromptRules() {
      const m = currentMeta(), len = sessionLen(), L = [];
      L.push("8. 칭찬 강도는 차등: 평소엔 짧은 칭찬(Nice!, Good!), 정확히 잘 말했을 때만 큰 칭찬. 가능하면 아이가 말한 단어를 집어 구체적으로 칭찬해.");
      L.push("9. 꼬리 질문은 yes/no 또는 'A or B' 같은 아주 쉬운 질문만 해. 'Why' 질문은 하지 마.");
      L.push("10. 안전: 이름·학교·주소·전화번호 같은 개인정보는 묻지 말고, 아이가 말해도 캐묻지 마. 무섭거나 부적절한 주제는 부드럽게 오늘 주제로 돌려 줘.");
      L.push("11. koSub는 enText(와 repeatEn)의 쉬운 한국어 뜻으로 항상 채워 줘.");
      if (appConfig.mode === "en") L.push("12. [영어 도전 모드] 아이는 영어로 말하려 하고 음성 인식도 영어 인식기라 전사가 어색하거나 틀릴 수 있어. 인식 오류일 수 있으니 뜻이 통하면 관대하게 받아 주고, 이해가 안 되면 틀렸다고 하지 말고 쉬운 영어로 되물으며 repeatEn에 쉬운 예시 문장을 넣어 줘.");
      if (m) L.push(`13. 오늘의 목표 문형: "${m.pattern}" / 목표 단어: ${m.words.join(", ")}. 대화 속에서 자연스럽게 쓰도록 유도해 줘.`);
      L.push(`14. 진행 상황: 아이가 지금까지 ${sessionTurn}번 대답했고 오늘은 총 ${len}번 대화해.` + (sessionTurn >= len ? " 이번이 마지막이니 새 질문은 하지 말고 따뜻하게 마무리해 줘." : ""));
      return L.join("\n");
    }

    function pickRandomDailyTopic() {
      const available = DAILY_TOPICS_POOL.map((_, i) => i).filter(i => !recentTopicIndices.includes(i));
      const pool = available.length > 0 ? available : DAILY_TOPICS_POOL.map((_, i) => i);
      const chosen = pool[Math.floor(Math.random() * pool.length)];
      recentTopicIndices.push(chosen);
      if (recentTopicIndices.length > 4) recentTopicIndices.shift();
      return DAILY_TOPICS_POOL[chosen];
    }

    function loadSavedConfig() {
      try {
        const saved = localStorage.getItem("ai_eng_friend_v8_config")
                   || localStorage.getItem("ai_eng_friend_v7_config")
                   || localStorage.getItem("ai_eng_friend_v6_config")
                   || localStorage.getItem("ai_eng_friend_v5_config");
        if (saved) {
          const parsed = JSON.parse(saved);
          appConfig = { ...appConfig, ...parsed };
        }
        const savedKey = localStorage.getItem("ai_eng_friend_gemini_key");
        if (savedKey) appConfig.apiKey = savedKey.trim();
        const savedSheet = localStorage.getItem("ai_eng_friend_sheet_url");
        if (savedSheet) appConfig.sheetUrl = savedSheet.trim();
      } catch (e) {}

      if (!appConfig.levelDesc || appConfig.levelDesc === "level7" || appConfig.levelDesc === "level6") {
        appConfig.levelDesc = CHILD_PRESETS[appConfig.preset]?.levelDesc || CHILD_PRESETS.child1.levelDesc;
      }

      const initTopic = pickRandomDailyTopic();
      appConfig.dailyTopic = initTopic.prompt;
      syncFormWithConfig();
      updateHeaderUI();
    }

      try {
        localStorage.setItem("ai_eng_friend_v8_config", JSON.stringify(appConfig));
        if (appConfig.apiKey) {
          localStorage.setItem("ai_eng_friend_gemini_key", appConfig.apiKey.trim());
        }
        if (appConfig.sheetUrl) {
          localStorage.setItem("ai_eng_friend_sheet_url", appConfig.sheetUrl.trim());
        }
      } catch (e) {}
    }

    function speakAiTurn(turnData, triggerEchoGuard = true) {
      if (!("speechSynthesis" in window)) {
        finishAiSpeech(triggerEchoGuard);
        return;
      }
      window.speechSynthesis.cancel();
      setUIState("ai_speaking");

      const utterances = [];
      const voices = window.speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.startsWith("en-US") && (v.name.includes("Google") || v.name.includes("Natural"))) || voices.find(v => v.lang.startsWith("en"));

      if (turnData.enText) {
        const uEn = new SpeechSynthesisUtterance(turnData.enText);
        uEn.lang = "en-US";
        if (enVoice) uEn.voice = enVoice;
        uEn.rate = Number(appConfig.speechRate) || 0.85;
        uEn.pitch = 1.08;
        utterances.push(uEn);
      }

      if (turnData.repeatEn && turnData.repeatEn.trim().length > 0) {
        const koVoice = voices.find(v => v.lang.startsWith("ko"));
        const uKo = new SpeechSynthesisUtterance(turnData.signalKo || "따라 해 볼래?");
        uKo.lang = "ko-KR";
        if (koVoice || voices.length === 0) {
          if (koVoice) uKo.voice = koVoice;
          uKo.rate = 0.95;
          utterances.push(uKo);
        }

        const uRep = new SpeechSynthesisUtterance(turnData.repeatEn.replace(/^["']|["']$/g, "").trim());
        uRep.lang = "en-US";
        if (enVoice) uRep.voice = enVoice;
        uRep.rate = Math.max(0.65, (Number(appConfig.speechRate) || 0.85) - 0.08);
        uRep.pitch = 1.1;
        utterances.push(uRep);
      }

      if (utterances.length === 0) {
        finishAiSpeech(triggerEchoGuard);
        return;
      }

      let idx = 0;
      let started = false;
      const watchDog = setTimeout(() => {
        if (!started) {
          pendingAutoplayTurn = turnData;
          setUIState("listening_ready", "화면을 한 번 터치하면 목소리가 나와요!");
        }
      }, 1200);

      function playNext() {
        if (idx >= utterances.length) {
          clearTimeout(watchDog);
          finishAiSpeech(triggerEchoGuard);
          return;
        }
        const cur = utterances[idx++];
        cur.onstart = () => { started = true; pendingAutoplayTurn = null; };
        cur.onend = () => playNext();
        cur.onerror = () => playNext();
        window.speechSynthesis.speak(cur);
      }
      playNext();
    }

    function speakRepeatOnly(repeatSentence, triggerEchoGuard = false) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const clean = (repeatSentence || "").replace(/^["']|["']$/g, "").trim();
      if (!clean) return;

      const u = new SpeechSynthesisUtterance(clean);
      u.lang = "en-US";
      u.rate = 0.78;
      u.pitch = 1.1;
      u.onend = () => { if (triggerEchoGuard) finishAiSpeech(true); };
      window.speechSynthesis.speak(u);
    }

    function speakEnglishSentenceOnly(enText) {
      if (!("speechSynthesis" in window) || !enText) return;
      window.speechSynthesis.cancel();
      const voices = window.speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.startsWith("en-US") && (v.name.includes("Google") || v.name.includes("Natural"))) || voices.find(v => v.lang.startsWith("en"));
      const u = new SpeechSynthesisUtterance(enText);
      u.lang = "en-US";
      if (enVoice) u.voice = enVoice;
      u.rate = Number(appConfig.speechRate) || 0.85;
      u.pitch = 1.08;
      window.speechSynthesis.speak(u);
    }

    function speakKoreanMeaning(koText) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(koText);
      u.lang = "ko-KR";
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }

    function buildGeminiContents(userText, isFirstGreeting) {
      const contents = [];
      const recent = chatHistory.slice(-10);
      for (const item of recent) {
        if (item.speaker === "child") {
          contents.push({
            role: "user",
            parts: [{ text: item.wasRepeat ? `[아이가 노란 줄 영어를 따라 말함]: "${item.text}"` : `[아이의 발화]: "${item.text}"` }]
          });
        } else {
          contents.push({ role: "model", parts: [{ text: JSON.stringify(item.turnData) }] });
        }
      }

      if (isFirstGreeting) {
        contents.push({
          role: "user",
          parts: [{ text: `[대화 시작 요청] 오늘의 일상 주제("${appConfig.dailyTopic}")에 딱 맞는 다정한 영어 첫인사와 쉬운 질문 하나를 enText에 적어 줘. 첫인사이므로 repeatEn과 signalKo는 빈 문자열("")로 비워 줘.` }]
        });
      } else if (expectEnglishRepeat) {
        contents.push({
          role: "user",
          parts: [{ text: `[아이가 방금 노란 줄 영어 문장을 따라 말함]: "${userText}" (${lastMatchHigh ? "목표 문장과 잘 일치함: 큰 칭찬" : "완벽하진 않지만 시도함: 작은 격려로 충분"}). 이번에는 repeatEn을 비우고(""), 이전과 다른 새로운 칭찬 표현으로 신나게 칭찬한 뒤 방금 이야기에서 이어지는 쉬운 꼬리 질문을 하나 해 줘!` }]
        });
      } else {
        contents.push({
          role: "user",
          parts: [{ text: `[아이의 방금 대답]: "${userText}". 조건 1/2/3 규칙을 판별해서 응답하되, 한국어 대답이면 아이가 말한 "${userText}"의 정확한 뜻을 쉬운 영어 문장으로 바꾸어 repeatEn에 넣어 줘.` }]
        });
      }
      return contents;
    }

    function safeParseAiJson(rawText) {
      if (!rawText) return null;
      let cleaned = rawText.replace(/```json|```/gi, "").trim();
      const firstBrace = cleaned.indexOf("{");
      const lastBrace = cleaned.lastIndexOf("}");
      if (firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace) {
        cleaned = cleaned.substring(firstBrace, lastBrace + 1);
      }
      try {
        const parsed = JSON.parse(cleaned);
        return {
          enText: parsed.enText || parsed.en_text || "",
          signalKo: parsed.signalKo || parsed.signal_ko || "",
          repeatEn: parsed.repeatEn || parsed.repeat_en || "",
          koSub: parsed.koSub || parsed.ko_sub || ""
        };
      } catch (e) {
        return null;
      }
    }

    // Google 서버에서 현재 키로 호출 가능한 모델 목록을 직접 조회한 뒤 호출하는 함수 (AQ. 및 AIza 키 모두 지원)
    let cachedWorkingModel = "";

    async function fetchAvailableFlashModels(apiKey) {
      const defaultModels = [
        "gemini-2.5-flash",
        "gemini-2.5-flash-lite",
        "gemini-3.8-flash",
        "gemini-3.7-flash",
        "gemini-3.1-flash-lite",
        "gemini-2.0-flash"
      ];
      try {
        const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models", {
          method: "GET",
          headers: { "x-goog-api-key": apiKey }
        });
        if (!res.ok) return defaultModels;
        const data = await res.json();
        const list = (data.models || [])
          .filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
          .map(m => m.name.replace(/^models\//, ""))
          .filter(name => name.includes("gemini") && !name.includes("tts") && !name.includes("image") && !name.includes("vision") && !name.includes("embedding"));

        const flashModels = list.filter(n => n.includes("flash"));
        if (flashModels.length > 0) {
          // 2.5-flash나 최신 flash를 앞으로 배치
          flashModels.sort((a, b) => {
            if (a === "gemini-2.5-flash") return -1;
            if (b === "gemini-2.5-flash") return 1;
            return b.localeCompare(a);
          });
          return flashModels;
        }
        if (list.length > 0) return list;
      } catch (e) {}
      return defaultModels;
    }

    async function callGeminiApiWithKey(apiKey, contents) {
      let modelsToTry = [];
      if (cachedWorkingModel) {
        modelsToTry.push(cachedWorkingModel);
      } else {
        modelsToTry = await fetchAvailableFlashModels(apiKey);
      }

      let firstRealError = "";

      for (const m of modelsToTry) {
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`;
          const res = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": apiKey
            },
            signal: AbortSignal.timeout ? AbortSignal.timeout(9000) : undefined,
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: buildSystemPrompt() }] },
              contents: contents,
              generationConfig: {
                temperature: 0.75,
                maxOutputTokens: 1024,
                ...(m.includes("2.5") ? { thinkingConfig: { thinkingBudget: 0 } } : {}),
                responseMimeType: "application/json"
              }
            })
          });

          if (res.ok) {
            const data = await res.json();
            const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
            const parsed = safeParseAiJson(raw);
            if (parsed && parsed.enText) {
              cachedWorkingModel = m;
              return { ok: true, model: m, turnResult: parsed };
            }
            if (!firstRealError) firstRealError = `[${m}] 응답 JSON 파싱 실패`;
          } else {
            const errData = await res.json().catch(() => ({}));
            const code = res.status;
            const msg = errData?.error?.message || `HTTP ${code}`;
            if (code === 429) {
              if (!firstRealError) firstRealError = `[${m}] 사용량 한도(429) 초과: 잠시 후 시도하거나 다른 모델을 탐색합니다.`;
              continue;
            }
            if (code === 401 || msg.includes("ACCESS_TOKEN_TYPE_UNSUPPORTED") || msg.includes("API_KEY_INVALID")) {
              return {
                ok: false,
                error: `[인증 오류 ${code}] ${msg}`
              };
            }
            if (!firstRealError) firstRealError = `[${m}] ${msg}`;
          }
        } catch (e) {
          if (!firstRealError) firstRealError = e.message || "네트워크 오류";
          if (e && (e.name === "TimeoutError" || e.name === "AbortError")) { firstRealError = "응답 시간 초과"; break; }
        }
      }

      cachedWorkingModel = "";
      return { ok: false, error: firstRealError || "호출 가능한 모델을 찾지 못했습니다." };
    }

    async function requestAiTurn(userText, isFirstGreeting = false) {
      setUIState("thinking");
      showThinkingDots();

      let turnResult = null;
      const geminiContents = buildGeminiContents(userText, isFirstGreeting);
      const cleanKey = (appConfig.apiKey || "").trim();

      if (isFirstGreeting) {
        turnResult = await buildSmartFallbackResponse("", true);
        if (cleanKey.length < 10) setConnectionStatus(false, "API 키 미입력");
      } else if (pendingRetry) {
        pendingRetry = false;
        turnResult = buildRetryResponse();
      } else if (cleanKey.length >= 10) {
        const apiRes = await callGeminiApiWithKey(cleanKey, geminiContents);
        if (apiRes.ok && apiRes.turnResult) {
          turnResult = apiRes.turnResult;
          setConnectionStatus(true, "Gemini AI 연결됨");
        } else {
          setConnectionStatus(false, apiRes.error || "API 응답 오류");
        }
      } else {
        setConnectionStatus(false, "API 키 미입력");
      }

      if (!turnResult || !turnResult.enText) {
        turnResult = await buildSmartFallbackResponse(userText, isFirstGreeting);
      }

      if (!isFirstGreeting && userText) {
        chatHistory.push({ speaker: "child", text: userText, wasRepeat: expectEnglishRepeat });
        sessionLogs.push({
          timestamp: new Date().toLocaleString("ko-KR"),
          childLabel: appConfig.childLabel,
          dailyTopic: appConfig.dailyTopic,
          category: expectEnglishRepeat ? "따라말하기 완료" : (turnResult.repeatEn ? "한국어/교정 유도" : "올바른 영어 발화"),
          userText: userText,
          aiText: turnResult.enText,
          repeatEn: turnResult.repeatEn || ""
        });
      }
      chatHistory.push({ speaker: "ai", turnData: turnResult });

      removeThinkingDots();
      lastAiResponse = turnResult;

      if (turnResult.repeatEn && turnResult.repeatEn.trim().length > 0) {
        expectEnglishRepeat = true;
        lastRepeatSentence = turnResult.repeatEn.replace(/^["']|["']$/g, "").trim();
      } else {
        expectEnglishRepeat = false;
        lastRepeatSentence = "";
      }

      appendAiBubble(turnResult);
      speakAiTurn(turnResult, true);
      if (!isFirstGreeting && sessionTurn >= sessionLen() && !turnResult.repeatEn) showSessionSummary();
    }

    async function runApiKeyTest() {
      const keyToTest = (apiKeyInput.value || "").trim();
      apiTestResultBox.className = "api-test-result";
      apiTestResultBox.style.display = "block";
      apiTestResultBox.textContent = "구글 Gemini 서버와 통신을 테스트하고 있습니다...";

      if (keyToTest.length < 10) {
        apiTestResultBox.className = "api-test-result fail";
        apiTestResultBox.textContent = "키가 너무 짧습니다. 올바른 키를 입력해 주세요.";
        return;
      }

      const testContents = [{
        role: "user",
        parts: [{ text: '테스트 요청입니다. {"enText":"Hi! Let us play!","signalKo":"","repeatEn":"","koSub":"안녕! 같이 놀자!"} 형식으로 응답해 줘.' }]
      }];

      const res = await callGeminiApiWithKey(keyToTest, testContents);
      if (res.ok) {
        appConfig.apiKey = keyToTest;
        saveConfigToStorage();
        setConnectionStatus(true, "Gemini AI 연결됨");
        apiTestResultBox.className = "api-test-result ok";
        apiTestResultBox.textContent = `연결 성공! (${res.model} 모델 정상 작동). 기기에 자동 저장되었습니다.`;
      } else {
        setConnectionStatus(false, "API 키 오류");
        apiTestResultBox.className = "api-test-result fail";
        apiTestResultBox.textContent = `연결 실패: ${res.error || "키를 다시 확인해 주세요."}`;
      }
    }

    function pickVariedPraise() {
      let idx = Math.floor(Math.random() * PRAISE_POOL.length);
      if (idx === lastPraiseIndex) idx = (idx + 1) % PRAISE_POOL.length;
      lastPraiseIndex = idx;
      return PRAISE_POOL[idx];
    }

    async function buildSmartFallbackResponse(userText, isFirstGreeting) {
      if (isFirstGreeting) {
        const matchedTopic = DAILY_TOPICS_POOL.find(item => item.prompt === appConfig.dailyTopic) || DAILY_TOPICS_POOL[0];
        return {
          enText: matchedTopic.greetingEn,
          signalKo: "",
          repeatEn: "",
          koSub: matchedTopic.greetingKo
        };
      }

      if (expectEnglishRepeat) {
        const praise = pickVariedPraise();
        return {
          enText: praise.en,
          signalKo: "",
          repeatEn: "",
          koSub: praise.ko
        };
      }

      const meta = currentMeta();
      const repeatEn = meta ? meta.example : "I feel good.";
      const randReaction = REACTION_POOL[Math.floor(Math.random() * REACTION_POOL.length)];
      return {
        enText: randReaction,
        signalKo: "따라 해 볼래?",
        repeatEn: repeatEn,
        koSub: `우와 멋지다! 영어로는 이렇게 말해 볼까? "${repeatEn}"`
      };
    }

    async function sendLogsToGoogleSheet() {
      if (!appConfig.sheetUrl || appConfig.sheetUrl.trim().length < 10 || sessionLogs.length === 0) return;
      try {
        await fetch(appConfig.sheetUrl.trim(), {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ childLabel: appConfig.childLabel, dailyTopic: appConfig.dailyTopic, logs: sessionLogs })
        });
        sessionLogs = [];
      } catch (e) {}
    }

    function toggleVoiceRecording() {
      if (isMicLocked || isAiSpeaking) return;
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        handleManualTextInput();
        return;
      }
      if (isRecording && recognition) {
        recognition.stop();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = (expectEnglishRepeat || appConfig.mode === "en") ? "en-US" : "ko-KR";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      speechStartTimestamp = Date.now();
      setUIState("user_recording");
      let finalTranscript = "";

      recognition.onresult = (event) => {
        if (event.results && event.results[0]) finalTranscript = event.results[0][0].transcript;
      };
      recognition.onerror = () => { setUIState("listening_ready", "다시 마이크를 눌러 말해 볼까요?"); };
      recognition.onend = () => {
        const duration = Date.now() - speechStartTimestamp;
        if (!finalTranscript || duration < 350) {
          setUIState("listening_ready");
          return;
        }
        processChildUtterance(finalTranscript.trim());
      };

      try { recognition.start(); } catch (e) { setUIState("listening_ready"); }
    }

    function processChildUtterance(text) {
      if (!text) return;
      const wasRepeat = expectEnglishRepeat;
      appendUserBubble(text, wasRepeat);
      stats.turns += 1;
      lastMatchHigh = true;
      pendingRetry = false;
      if (wasRepeat) {
        stats.repeats += 1;
        lastRepeatScore = repeatScore(text, lastRepeatSentence);
        lastMatchHigh = lastRepeatScore >= 0.7;
        repeatTries += 1;
        pendingRetry = !lastMatchHigh && repeatTries <= MAX_RETRY;
        if (!pendingRetry) repeatTries = 0;
      } else {
        sessionTurn += 1;
      }
      updateHeaderUI();
      requestAiTurn(text, false);
    }

    function handleManualTextInput() {
      if (isMicLocked || isAiSpeaking) return;
      const val = prompt(expectEnglishRepeat ? `따라 말할 영어: ${lastRepeatSentence}` : "대답할 내용을 적어보세요:");
      if (val && val.trim().length > 0) processChildUtterance(val.trim());
    }

    function openSettingsModal() {
      syncFormWithConfig();
      apiTestResultBox.style.display = "none";
      settingsModal.classList.add("open");
    }
    function closeSettingsModal() { settingsModal.classList.remove("open"); }

    function startFreshGreeting(pickNew = true) {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      if (pickNew) {
        const picked = pickRandomDailyTopic();
        appConfig.dailyTopic = picked.prompt;
        dailyTopicInput.value = appConfig.dailyTopic;
      }
      updateHeaderUI();
      chatHistory = [];
      sessionTurn = 0; sessionEnded = false; repeatTries = 0; pendingRetry = false;
      expectEnglishRepeat = false;
      lastRepeatSentence = "";
      lastAiResponse = null;
      chatContainer.innerHTML = "";
      chatContainer.appendChild(topicBanner);
      requestAiTurn("", true);
    }

    if (openSettingsBtn) openSettingsBtn.addEventListener("click", openSettingsModal);
    if (connStatusPill) connStatusPill.addEventListener("click", openSettingsModal);
    if (childNameBadge) childNameBadge.addEventListener("click", openSettingsModal);
    if (apiNoticeBar) apiNoticeBar.addEventListener("click", openSettingsModal);
    if (closeSettingsBtn) closeSettingsBtn.addEventListener("click", closeSettingsModal);
    if (testApiKeyBtn) testApiKeyBtn.addEventListener("click", runApiKeyTest);

    if (settingsModal) {
      settingsModal.addEventListener("click", (e) => { if (e.target === settingsModal) closeSettingsModal(); });
    }

    if (micCapsule) {
      micCapsule.addEventListener("click", () => {
        if (sessionEnded) startFreshGreeting(true);
        else if (chatHistory.length === 0 && !lastAiResponse) requestAiTurn("", true);
        else toggleVoiceRecording();
      });
    }

    if (topicBanner) topicBanner.addEventListener("click", () => startFreshGreeting(true));

    if (replayLastAiBtn) {
      replayLastAiBtn.addEventListener("click", () => {
        if (lastAiResponse) {
          if (lastAiResponse.repeatEn && lastAiResponse.repeatEn.trim().length > 0) speakRepeatOnly(lastAiResponse.repeatEn, false);
          else speakAiTurn(lastAiResponse, false);
        }
      });
    }

    if (avatarCircle) {
      avatarCircle.addEventListener("click", () => {
        if (lastAiResponse) speakAiTurn(lastAiResponse, false);
      });
    }

    if (reportStopBtn) {
      reportStopBtn.addEventListener("click", () => {
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        if (recognition && isRecording) recognition.stop();
        stats.stops += 1;
        updateHeaderUI();
        sendLogsToGoogleSheet();
        setUIState("listening_ready", "대화를 멈췄어요. 수고했어요!");
      });
    }

    presetTabs.forEach(tab => {
      tab.addEventListener("click", () => {
        const k = tab.dataset.preset;
        appConfig.preset = k;
        presetTabs.forEach(b => b.classList.toggle("active", b === tab));
        if (CHILD_PRESETS[k]) {
          const p = CHILD_PRESETS[k];
          aiNameInput.value = p.aiName;
          childLabelInput.value = p.childLabel;
          levelRuleInput.value = p.levelDesc;
          speechRateInput.value = p.speechRate;
          speedValLabel.textContent = p.speechRate.toFixed(2) + "x";
          interestsInput.value = p.interests;
        }
      });
    });

    if (speechRateInput) {
      speechRateInput.addEventListener("input", () => {
        speedValLabel.textContent = Number(speechRateInput.value).toFixed(2) + "x";
      });
    }

    if (randomTopicBtn) {
      randomTopicBtn.addEventListener("click", () => {
        dailyTopicInput.value = pickRandomDailyTopic().prompt;
      });
    }

    if (clearChatBtn) {
      clearChatBtn.addEventListener("click", () => {
        closeSettingsModal();
        startFreshGreeting(false);
      });
    }

    if (saveSettingsBtn) {
      saveSettingsBtn.addEventListener("click", () => {
        appConfig.aiName = aiNameInput.value.trim() || "베니";
        appConfig.childLabel = childLabelInput.value.trim() || "첫째 (7세)";
        appConfig.levelDesc = levelRuleInput.value.trim() || CHILD_PRESETS.child1.levelDesc;
        appConfig.dailyTopic = dailyTopicInput.value.trim() || DAILY_TOPICS_POOL[0].prompt;
        appConfig.interests = interestsInput.value.trim();
        appConfig.speechRate = parseFloat(speechRateInput.value) || 0.85;
        appConfig.apiKey = apiKeyInput.value.trim();
        appConfig.sheetUrl = sheetUrlInput.value.trim();

        saveConfigToStorage();
        closeSettingsModal();
        startFreshGreeting(false);
      });
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    }

    modeToggleBtn.addEventListener("click", () => {
      if (isRecording) return;
      appConfig.mode = appConfig.mode === "en" ? "ko" : "en";
      saveConfigToStorage();
      updateModeUI();
      if (!isMicLocked) setUIState("listening_ready");
    });
    helpBtn.addEventListener("click", giveHelp);

    window.addEventListener("DOMContentLoaded", () => {
      loadSavedConfig();
      updateModeUI();
      setTimeout(() => { requestAiTurn("", true); }, 250);
    });
  </script>
</body>
</html>
