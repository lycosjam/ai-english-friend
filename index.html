<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>숲속 텐트 영어 친구 3D · 파닉스</title>
<style>
:root{
  --ink:#223c2a;
  --sky1:#9fdcff;
  --sky2:#e6faff;
  --sky3:#d9f7c6;
  --grass1:#8de068;
  --grass2:#68bf4b;
  --yellow:#ffd65a;
  --yellow-edge:#e0a514;
  --pink:#ff6d94;
  --pink-edge:#cc3f67;
  --green:#2fd173;
  --green-edge:#1c9c52;
  --clay-shadow:0 10px 22px rgba(27,63,39,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:var(--ink);
  height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  background:radial-gradient(circle at 20% 8%, #fffbe0 0%, rgba(255,251,224,0) 32%),
             linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 52%,var(--sky3) 82%);
}

/* 3D Clay Scenic Background */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.sun{
  position:absolute;top:-22px;left:18px;width:82px;height:82px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #fff8c4 0%, #ffd95a 58%, #f4b622 100%);
  box-shadow:0 0 38px rgba(255,221,98,.65), inset -6px -8px 14px rgba(224,142,0,.28);
  opacity:.92;
}
.cloud{
  position:absolute;width:118px;height:42px;border-radius:50px;left:-150px;
  background:linear-gradient(180deg,#ffffff 0%,#e9f6ff 100%);
  box-shadow:0 10px 16px rgba(59,122,163,.12), inset 0 -5px 8px rgba(154,205,235,.45), inset 0 4px 6px rgba(255,255,255,.95);
  animation:drift 30s linear infinite;
}
.cloud::before,.cloud::after{
  content:'';position:absolute;border-radius:50%;
  background:linear-gradient(180deg,#ffffff 0%,#edf7ff 100%);
  box-shadow:inset 0 4px 6px rgba(255,255,255,.95);
}
.cloud::before{width:50px;height:50px;left:18px;top:-22px}
.cloud::after{width:64px;height:64px;left:46px;top:-30px}
.c1{top:56px}.c2{top:164px;width:92px;height:34px;animation-duration:38s;animation-delay:-14s;opacity:.88}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(125vw)}}

.hills{position:fixed;left:0;right:0;bottom:0;height:210px;z-index:-1;pointer-events:none;overflow:hidden}
.hill-back{
  position:absolute;bottom:-125px;left:-20%;width:140%;height:260px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 18%, #a6eb7e 0%, #7ad359 60%, #5bb23f 100%);
  box-shadow:inset 0 10px 18px rgba(255,255,255,.42);
}
.hill-front{
  position:absolute;bottom:-155px;left:-12%;width:124%;height:255px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 15%, #96e46f 0%, #6ac54c 65%, #4da134 100%);
  box-shadow:0 -8px 20px rgba(36,92,46,.12), inset 0 10px 18px rgba(255,255,255,.38);
}
.scenic-props{position:absolute;inset:0;width:100%;height:100%}

/* Top Header - 3D Clay Pills */
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;flex-shrink:0}
.book-pill{
  flex:1;min-width:0;height:46px;border-radius:999px;padding:0 14px;border:none;cursor:pointer;
  background:linear-gradient(180deg,#ffffff 0%,#f1f8ef 100%);
  box-shadow:0 5px 0 #c7dcc4, 0 8px 14px rgba(30,66,40,.14), inset 0 3px 4px #ffffff, inset 0 -2px 4px rgba(130,168,125,.25);
  display:flex;align-items:center;gap:8px;font-family:inherit;color:var(--ink);text-align:left;
  transition:transform .1s,box-shadow .1s;
}
.book-pill:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #c7dcc4, 0 4px 8px rgba(30,66,40,.14), inset 0 2px 4px rgba(130,168,125,.2);
}
.tag{
  font-size:11.5px;font-weight:900;color:#994f00;border-radius:999px;padding:4px 9px;white-space:nowrap;flex-shrink:0;
  background:linear-gradient(180deg,#fff1c2 0%,#ffd77a 100%);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.8), 0 2px 0 rgba(178,94,0,.22);
}
.book-title{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.mode-pill{
  height:46px;border-radius:999px;border:none;padding:0 13px;cursor:pointer;flex-shrink:0;
  background:linear-gradient(180deg,#ffffff 0%,#edf6ee 100%);
  box-shadow:0 5px 0 #c4dac2, 0 8px 14px rgba(30,66,40,.14), inset 0 3px 4px #ffffff;
  display:flex;align-items:center;gap:5px;font-family:inherit;font-size:13px;font-weight:900;color:var(--ink);white-space:nowrap;
  transition:transform .1s,box-shadow .1s,background .2s;
}
.mode-pill.auto{
  background:linear-gradient(180deg,#52e890 0%,#24c668 100%);color:#fff;
  box-shadow:0 5px 0 #18964c, 0 8px 14px rgba(24,150,76,.26), inset 0 3px 4px rgba(255,255,255,.45);
}
.mode-pill:active{transform:translateY(3px);box-shadow:0 2px 0 #c4dac2, inset 0 2px 3px rgba(0,0,0,.06)}
.mode-pill.auto:active{box-shadow:0 2px 0 #18964c}

.round-btn{
  width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;position:relative;
  background:linear-gradient(180deg,#ffffff 0%,#edf5ee 100%);
  box-shadow:0 5px 0 #c4dac2, 0 8px 14px rgba(30,66,40,.14), inset 0 3px 4px #ffffff;
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s,box-shadow .1s;
}
.round-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c4dac2}
.lock-dot{
  position:absolute;right:3px;bottom:3px;width:15px;height:15px;border-radius:50%;
  background:linear-gradient(180deg,#fff0bc 0%,#ffcb52 100%);
  border:1.5px solid #c98a00;
  box-shadow:0 2px 3px rgba(0,0,0,.16);
  display:flex;align-items:center;justify-content:center;
}

/* Stage & 3D Bear Character */
.stage{
  flex:1;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(5px,1.1dvh,9px);
  padding:2px 16px;
  overflow:hidden;
}
.teacher-wrap{
  position:relative;
  width:clamp(100px,16.5dvh,138px);
  height:clamp(100px,16.5dvh,138px);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  cursor:pointer;
}
.bear-pedestal{
  position:absolute;bottom:4px;width:66%;height:16px;border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(35,84,48,.24) 0%, rgba(35,84,48,0) 72%);
  pointer-events:none;
  transition:transform .25s,opacity .25s;
}
.teacher-wrap.talking .bear-pedestal{animation:shadowPulse .55s ease-in-out infinite}
@keyframes shadowPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(.86);opacity:.6}}

.mic-ring{
  position:absolute;inset:4px;border-radius:50%;
  border:4px solid rgba(46,204,113,0);
  transform:scale(1);
  transition:transform .08s ease-out,border-color .2s,background-color .2s,box-shadow .2s;
  pointer-events:none;
}
.teacher-wrap.listening .mic-ring{
  border-color:rgba(46,204,113,.65);
  background:radial-gradient(circle, rgba(46,204,113,.14) 0%, rgba(46,204,113,.02) 70%);
  box-shadow:0 0 18px rgba(46,204,113,.32), inset 0 0 12px rgba(255,255,255,.5);
  transform:scale(var(--mic-scale,1.05));
}
.teacher-wrap.talking .mic-ring{
  border-color:rgba(255,186,26,.5);
  background:radial-gradient(circle, rgba(255,214,90,.16) 0%, rgba(255,214,90,0) 70%);
  animation:talkRing .9s ease-in-out infinite;
}
@keyframes talkRing{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

#bear3dCanvas{
  width:100%;height:100%;display:block;position:relative;z-index:2;
  filter:drop-shadow(0 6px 8px rgba(28,62,38,.16));
}
/* 3D-shaded fallback SVG if WebGL/CDN unavailable */
.bear-fallback{width:88%;height:88%;position:relative;z-index:2;display:none}
.teacher-wrap.fallback-mode #bear3dCanvas{display:none}
.teacher-wrap.fallback-mode .bear-fallback{display:block}
.teacher-wrap.fallback-mode.talking .bear-fallback{animation:bob .55s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* Turn Indicator Pill - 3D Glossy Badge */
.turn-pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 15px;border-radius:999px;
  font-size:13.5px;font-weight:900;
  background:linear-gradient(180deg,#ffffff 0%,#eef7ed 100%);
  color:var(--ink);
  box-shadow:0 4px 0 #c9dec7, 0 6px 12px rgba(30,66,40,.1), inset 0 2px 3px #ffffff;
  border:2px solid #d5ead2;
  min-height:31px;
  flex-shrink:0;
  transition:all .2s;
}
.turn-pill.talking{
  background:linear-gradient(180deg,#fffbef 0%,#ffefc2 100%);
  border-color:#ffbf38;color:#8a4b00;
  box-shadow:0 4px 0 #e0a626, 0 6px 12px rgba(204,138,0,.15), inset 0 2px 3px #ffffff;
}
.turn-pill.listening{
  background:linear-gradient(180deg,#f0fff6 0%,#d3f9e3 100%);
  border-color:#2ecc71;color:#116333;
  box-shadow:0 4px 0 #21a659, 0 6px 12px rgba(33,166,89,.18), inset 0 2px 3px #ffffff;
}
.turn-pill.auto{
  background:linear-gradient(180deg,#f5faff 0%,#dfeeff 100%);
  border-color:#68acff;color:#154c96;
  box-shadow:0 4px 0 #4d90e3, 0 6px 12px rgba(77,144,227,.14), inset 0 2px 3px #ffffff;
}
.turn-pill.hidden{display:none}
.turn-dot{
  width:9px;height:9px;border-radius:50%;background:currentColor;flex-shrink:0;
  box-shadow:inset 0 2px 2px rgba(255,255,255,.55);
}
.turn-pill.listening .turn-dot{animation:dotBlink .9s infinite}
@keyframes dotBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}

.caption{
  display:none;max-width:440px;text-align:center;font-size:14.5px;font-weight:800;color:#224e31;
  background:linear-gradient(180deg,#ffffff 0%,#f3faf3 100%);
  border-radius:16px;padding:7px 14px;line-height:1.38;
  box-shadow:0 4px 0 rgba(36,64,44,.1), inset 0 2px 3px #ffffff;
  flex-shrink:0;
}
.caption.show{display:block}

/* Main Card - 3D Toy Tablet Frame + Clean Natural Sentence Flow */
.card{
  width:100%;max-width:460px;
  min-height:clamp(150px,23dvh,198px);
  border-radius:30px;
  padding:clamp(15px,2.2dvh,22px) 18px;
  background:linear-gradient(180deg,#ffffff 0%,#fffdf5 65%,#faf4e3 100%);
  border:5px solid var(--yellow);
  box-shadow:
    0 9px 0 var(--yellow-edge),
    0 16px 26px rgba(32,66,42,.18),
    inset 0 4px 6px rgba(255,255,255,.95),
    inset 0 -4px 8px rgba(212,175,92,.18);
  text-align:center;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  gap:10px;
  transition:border-color .2s,box-shadow .2s;
  flex-shrink:0;
}
.card.auto-active,.card.listening-active{
  border-color:#35d678;
  box-shadow:
    0 9px 0 #1f9f55,
    0 16px 26px rgba(31,159,85,.22),
    inset 0 4px 6px rgba(255,255,255,.95),
    inset 0 -4px 8px rgba(46,204,113,.14);
}
.card.empty{
  border-color:#b6e59c;
  box-shadow:
    0 9px 0 #82be64,
    0 16px 26px rgba(32,66,42,.14),
    inset 0 4px 6px rgba(255,255,255,.95);
}
.card .en{
  font-size:clamp(28px,8vw,42px);
  font-weight:900;line-height:1.4;color:#1b3859;
  word-break:keep-all;
  display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;
  gap:2px 2px;
}
.card .en.small{font-size:22px}
.word-btn{
  display:inline-block;
  padding:2px 4px;
  border-radius:10px;
  cursor:pointer;
  transition:transform .12s,background-color .15s,box-shadow .15s,color .15s;
}
.word-btn:hover{background:#fff5cf}
.word-btn:active{transform:scale(.95)}
.word-btn.active{
  background:linear-gradient(180deg,#ffea96 0%,#ffd34f 100%);
  color:#5c3400;
  box-shadow:0 3px 0 #d99f0f, inset 0 2px 2px rgba(255,255,255,.7);
  transform:translateY(-1px);
}

.word-meaning-box{display:none;align-items:center;justify-content:center;width:100%}
.word-meaning-box.show{display:flex}
.word-tools-row{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;max-width:100%}
.phonics-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(180deg,#fff7df 0%,#ffdf85 100%);
  border:2px solid #f0b21a;color:#6e3f00;
  font-size:14px;font-weight:900;
  padding:6px 12px;border-radius:999px;
  cursor:pointer;font-family:inherit;white-space:nowrap;
  box-shadow:0 4px 0 #d49408, 0 4px 8px rgba(178,116,0,.15), inset 0 2px 3px rgba(255,255,255,.85);
  transition:transform .1s,box-shadow .1s;
  touch-action:manipulation;
}
.phonics-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #d49408}
.phonics-strip{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;
  background:linear-gradient(180deg,#fffdf5 0%,#fff3cc 100%);
  border:2px solid #f3be33;
  padding:5px 10px;border-radius:999px;
  box-shadow:0 4px 0 #d69c14, inset 0 2px 3px rgba(255,255,255,.9);
  animation:popIn .16s ease-out;
  max-width:100%;
  cursor:pointer;
  touch-action:manipulation;
}
.p-chunk{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:26px;height:28px;padding:0 7px;border-radius:10px;
  background:#ffffff;border:1.5px solid #e6cb7a;
  font-size:16px;font-weight:900;color:#274463;
  transition:transform .14s,background .14s,color .14s,box-shadow .14s,border-color .14s;
}
.p-chunk.lit{
  background:linear-gradient(180deg,#ffea85 0%,#ffc72c 100%);
  border-color:#d98b00;color:#4a2600;
  transform:scale(1.16) translateY(-2px);
  box-shadow:0 3px 0 #c97f00;
}
.p-dot{font-size:13px;font-weight:900;color:#c79b32;line-height:1}
.p-arrow{font-size:13px;font-weight:900;color:#b87d00;margin:0 1px}
.p-whole{
  display:inline-flex;align-items:center;justify-content:center;
  height:28px;padding:0 10px;border-radius:10px;
  background:#edf7ee;border:1.5px solid #96d68a;
  font-size:16px;font-weight:900;color:#175722;
  transition:transform .16s,background .16s,color .16s,box-shadow .16s;
}
.p-whole.lit{
  background:linear-gradient(180deg,#64ee9d 0%,#28c768 100%);
  border-color:#18944a;color:#ffffff;
  transform:scale(1.12) translateY(-1px);
  box-shadow:0 3px 0 #168241;
}
.sight-strip{
  display:inline-flex;align-items:center;gap:7px;
  background:linear-gradient(180deg,#f3f8ff 0%,#dcebff 100%);
  border:2px solid #75b1ff;color:#14468c;
  font-size:14.5px;font-weight:900;
  padding:6px 13px;border-radius:999px;
  box-shadow:0 4px 0 #4f8de0, inset 0 2px 3px rgba(255,255,255,.9);
  animation:popIn .16s ease-out;
  cursor:pointer;
}
.sight-tag{
  font-size:11.5px;font-weight:900;color:#fff;
  background:linear-gradient(180deg,#5ba1ff 0%,#2d7be8 100%);
  padding:2px 8px;border-radius:999px;
}
.back-meaning-btn{
  display:inline-flex;align-items:center;justify-content:center;
  height:30px;padding:0 10px;border-radius:999px;border:2px solid #8fd46b;
  background:#f0faf2;color:#18541d;font-size:12.5px;font-weight:900;
  cursor:pointer;font-family:inherit;white-space:nowrap;
  box-shadow:0 3px 0 #66b355;
}
.back-meaning-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #66b355}
.word-meaning-pill{
  display:inline-flex;align-items:center;gap:7px;
  background:linear-gradient(180deg,#f4fff6 0%,#daf7df 100%);
  border:2px solid #7cd167;color:#18541d;
  font-size:16.5px;font-weight:900;
  padding:6px 15px;border-radius:999px;
  cursor:pointer;font-family:inherit;
  box-shadow:0 4px 0 #55aa42, 0 5px 10px rgba(27,94,32,.14), inset 0 2px 3px rgba(255,255,255,.9);
  animation:popIn .16s ease-out;
}
.word-meaning-pill:active{transform:translateY(2px);box-shadow:0 2px 0 #55aa42}
.word-meaning-pill strong{color:#0d47a1}
.word-meaning-pill .spk-ic{
  display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
  background:#fff;color:#1b5e20;flex-shrink:0;
  box-shadow:0 2px 3px rgba(27,94,32,.15);
}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.card .hint{font-size:12.5px;font-weight:700;color:#839689;white-space:nowrap}

.card.finish{
  border-color:#ffb61e;
  background:linear-gradient(180deg,#fffef5 0%,#fff3c2 100%);
  box-shadow:0 9px 0 #d68b00, 0 18px 28px rgba(178,108,0,.22), inset 0 4px 8px #ffffff;
  gap:10px;
}
.trophy-badge{
  width:62px;height:62px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff4b8 0%, #ffd54f 60%, #f0a800 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 0 #c98600, 0 8px 14px rgba(178,116,0,.28), inset 0 3px 5px rgba(255,255,255,.8);
}
.finish-title{font-size:23px;font-weight:900;color:#a85500;line-height:1.25}
.finish-sub{font-size:14.5px;font-weight:800;color:#4b6b55}
.finish-actions{display:flex;gap:10px;width:100%;margin-top:4px}
.finish-btn{
  flex:1;padding:13px 10px;border-radius:18px;border:none;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;
  transition:transform .1s,box-shadow .1s;
}
.finish-btn.again{
  background:linear-gradient(180deg,#ffffff 0%,#fff6d8 100%);color:var(--ink);border:2.5px solid #ffd45c;
  box-shadow:0 5px 0 #d9a726, inset 0 2px 3px #ffffff;
}
.finish-btn.other{
  background:linear-gradient(180deg,#ff89a8 0%,#ff5c87 100%);color:#fff;
  box-shadow:0 5px 0 var(--pink-edge), inset 0 3px 4px rgba(255,255,255,.4);
}
.finish-btn:active{transform:translateY(3px)}

/* 3D Glossy Progress Beads */
.dots{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;min-height:15px;flex-shrink:0}
.dot{
  width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.75) 0%, rgba(36,64,44,.22) 70%);
  box-shadow:0 2px 3px rgba(36,64,44,.16);
  transition:all .25s;
}
.dot.done{
  background:radial-gradient(circle at 35% 30%, #98ffbe 0%, #2ecc71 58%, #1c9c52 100%);
  box-shadow:0 2px 0 #157d41, 0 3px 6px rgba(28,156,82,.28);
  transform:scale(1.06);
}
.dot.cur{
  background:radial-gradient(circle at 35% 30%, #fff3a8 0%, #ffb700 58%, #d68a00 100%);
  box-shadow:0 2px 0 #b57300, 0 0 0 3px rgba(255,183,0,.35);
  transform:scale(1.24);
}
.book-big{font-size:27px;font-weight:900;color:#1b3859;line-height:1.3}
.start-book{
  margin-top:6px;padding:15px 32px;border-radius:24px;border:none;cursor:pointer;font-family:inherit;
  background:linear-gradient(180deg,#ff89a8 0%,#ff5784 100%);
  color:#fff;font-size:21px;font-weight:900;
  box-shadow:0 7px 0 var(--pink-edge), 0 12px 20px rgba(204,63,103,.32), inset 0 3px 5px rgba(255,255,255,.45);
  transition:transform .1s,box-shadow .1s;
}
.start-book:active{
  transform:translateY(4px);
  box-shadow:0 3px 0 var(--pink-edge), 0 5px 10px rgba(204,63,103,.25);
}
.childline{font-size:13.5px;font-weight:800;color:#176335;min-height:18px;text-align:center;flex-shrink:0}

/* Bottom Dock - 3D Clay Toy Keys (Strictly Symmetric 5-Column Alignment) */
.dock{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  padding:6px 10px calc(12px + env(safe-area-inset-bottom, 0px));
  max-width:520px;width:100%;margin:0 auto;
  align-items:end;
  flex-shrink:0;
}
.ctl{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:6px;border:none;background:none;cursor:pointer;font-family:inherit;
}
.ctl .face{
  width:58px;height:58px;border-radius:20px;
  background:linear-gradient(180deg,#ffffff 0%,#f2f8ef 65%,#e2efe0 100%);
  box-shadow:
    0 6px 0 #b8d1b5,
    0 10px 16px rgba(26,64,38,.2),
    inset 0 3px 4px rgba(255,255,255,.98),
    inset 0 -3px 5px rgba(126,166,122,.28);
  display:flex;align-items:center;justify-content:center;
  transition:transform .09s,box-shadow .09s,background .2s;
}
.ctl:active .face{
  transform:translateY(4px);
  box-shadow:0 2px 0 #b8d1b5, 0 4px 8px rgba(26,64,38,.18), inset 0 2px 4px rgba(126,166,122,.25);
}
.ctl:disabled{opacity:.42;cursor:default}
.ctl:disabled:active .face{
  transform:none;
  box-shadow:0 6px 0 #b8d1b5, 0 10px 16px rgba(26,64,38,.2), inset 0 3px 4px rgba(255,255,255,.98);
}
.ctl > span:last-child{
  font-size:12.5px;font-weight:900;color:#1d3b27;white-space:nowrap;line-height:1.2;
  text-shadow:0 1px 0 rgba(255,255,255,.65);
}
.ctl.mic .face{
  width:64px;height:64px;border-radius:22px;color:#fff;
  background:linear-gradient(180deg,#ff8dab 0%,#ff5b87 65%,#eb4775 100%);
  box-shadow:
    0 7px 0 var(--pink-edge),
    0 12px 18px rgba(196,49,92,.32),
    inset 0 4px 5px rgba(255,255,255,.48),
    inset 0 -3px 5px rgba(163,28,69,.28);
}
.ctl.mic:active .face{
  transform:translateY(4px);
  box-shadow:0 3px 0 var(--pink-edge), 0 5px 10px rgba(196,49,92,.28), inset 0 2px 4px rgba(255,255,255,.35);
}
.ctl.mic.on .face{
  background:linear-gradient(180deg,#59ee96 0%,#26cc6b 65%,#1cb65d 100%);
  box-shadow:
    0 7px 0 var(--green-edge),
    0 12px 18px rgba(28,156,82,.35),
    inset 0 4px 5px rgba(255,255,255,.5);
  animation:pulse3d 1.15s infinite;
}
@keyframes pulse3d{
  0%,100%{box-shadow:0 7px 0 var(--green-edge), 0 0 0 0 rgba(46,204,113,.55), inset 0 4px 5px rgba(255,255,255,.5)}
  50%{box-shadow:0 7px 0 var(--green-edge), 0 0 0 12px rgba(46,204,113,0), inset 0 4px 5px rgba(255,255,255,.5)}
}
.flag svg{display:block;border-radius:5px;box-shadow:0 2px 4px rgba(0,0,0,.14)}

/* Splash */
.splash{
  position:fixed;inset:0;z-index:30;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:24px;text-align:center;
  background:radial-gradient(circle at 25% 15%, #fffbe0 0%, rgba(255,251,224,0) 35%),
             linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 58%,var(--sky3) 100%);
}
.splash.hide{display:none}
.splash-badge{
  width:96px;height:96px;border-radius:30px;
  background:linear-gradient(180deg,#ffffff 0%,#eef9ec 100%);
  box-shadow:0 8px 0 #c3dcc0, 0 16px 26px rgba(30,72,44,.18), inset 0 4px 6px #ffffff;
  display:flex;align-items:center;justify-content:center;
}
.splash h1{
  font-size:32px;font-weight:900;color:#1b5533;line-height:1.3;
  text-shadow:0 2px 0 rgba(255,255,255,.8);
}
.big-start{
  padding:20px 44px;font-size:24px;font-weight:900;border:none;border-radius:28px;cursor:pointer;font-family:inherit;
  background:linear-gradient(180deg,#ffe176 0%,#ffb81c 100%);
  color:#422b00;
  box-shadow:0 8px 0 #c98600, 0 14px 24px rgba(178,118,0,.28), inset 0 4px 5px rgba(255,255,255,.68);
  transition:transform .1s,box-shadow .1s;
}
.big-start:active{transform:translateY(5px);box-shadow:0 3px 0 #c98600, 0 6px 12px rgba(178,118,0,.22)}
.msg{font-size:14px;font-weight:800;color:#c62828;min-height:20px;max-width:400px}

/* Modals - Soft 3D Clay Sheet */
.modal-back{position:fixed;inset:0;background:rgba(24,52,33,.48);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal-back.open{display:flex}
.modal-back.center{align-items:center;padding:18px}
.modal{
  background:linear-gradient(180deg,#fffef9 0%,#f9f5e8 100%);
  width:100%;max-width:520px;max-height:92dvh;border-radius:30px 30px 0 0;
  box-shadow:0 -8px 30px rgba(20,48,28,.22), inset 0 3px 4px #ffffff;
  display:flex;flex-direction:column;overflow:hidden;
}
.modal.gate-box{max-width:360px;border-radius:28px;box-shadow:0 18px 40px rgba(0,0,0,.24), inset 0 3px 4px #ffffff}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:2px solid #ece3cb}
.modal-head h2{font-size:18px;font-weight:900}
.x{
  width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;color:var(--ink);font-size:18px;font-weight:900;
  background:linear-gradient(180deg,#f7f2e3 0%,#e7dec5 100%);
  box-shadow:0 3px 0 #cfc3a4, inset 0 2px 3px #ffffff;
}
.x:active{transform:translateY(2px);box-shadow:0 1px 0 #cfc3a4}
.modal-body{overflow:auto;padding:15px 18px;display:flex;flex-direction:column;gap:15px}
.flabel{display:block;font-weight:900;font-size:15px;margin-bottom:4px}
.fhelp{display:block;font-size:12.5px;font-weight:700;color:#5f7a67;margin-top:4px;line-height:1.4}
input,select{
  width:100%;padding:12px 14px;border-radius:14px;border:2px solid #c9e2bc;font-size:15px;font-family:inherit;
  background:#fff;color:var(--ink);margin-top:6px;
  box-shadow:inset 0 2px 4px rgba(36,64,44,.06);
}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.sub{
  padding:10px 14px;border-radius:13px;border:2px solid #c7e0ba;cursor:pointer;color:var(--ink);font-family:inherit;font-weight:800;font-size:14px;
  background:linear-gradient(180deg,#f7fdf2 0%,#e6f5dc 100%);
  box-shadow:0 3px 0 #b7d4a8, inset 0 2px 2px #ffffff;
}
.sub:active{transform:translateY(2px);box-shadow:0 1px 0 #b7d4a8}
.res{font-size:13.5px;font-weight:700}
.res.ok{color:#17803d}.res.bad{color:#c62828}
.seg2,.seg3,.seg4{display:grid;gap:8px;margin-top:6px}
.seg2{grid-template-columns:1fr 1fr}
.seg3{grid-template-columns:1fr 1fr 1fr}
.seg4{grid-template-columns:1fr 1fr}
.seg2 button,.seg3 button,.seg4 button{
  padding:12px 8px;border-radius:14px;border:2.5px solid #d5e8c6;cursor:pointer;color:var(--ink);font-family:inherit;font-weight:800;font-size:14px;
  background:linear-gradient(180deg,#ffffff 0%,#f2f8ed 100%);
  box-shadow:0 3px 0 #c1d9b2, inset 0 2px 2px #ffffff;
}
.seg2 button.on,.seg3 button.on,.seg4 button.on{
  background:linear-gradient(180deg,#ffea92 0%,#ffd24c 100%);border-color:#f2ad00;color:#4a2f00;
  box-shadow:0 3px 0 #cc8e00, inset 0 2px 3px rgba(255,255,255,.7);
}
.modal-foot{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:14px 18px;border-top:2px solid #ece3cb}
.primary{
  padding:14px 28px;border-radius:16px;border:none;cursor:pointer;font-family:inherit;font-weight:900;font-size:17px;
  background:linear-gradient(180deg,#ffdf6b 0%,#ffb515 100%);color:#3b2600;
  box-shadow:0 5px 0 #c98600, inset 0 3px 4px rgba(255,255,255,.6);
}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #c98600}

/* Parental Gate */
.gate-desc{font-size:14px;font-weight:700;color:#556f5d;text-align:center}
.gate-q{
  font-size:30px;font-weight:900;color:#1d3b5c;text-align:center;padding:10px;border-radius:16px;
  background:linear-gradient(180deg,#f5fbf0 0%,#e8f5e0 100%);border:2px solid #cde5bf;
  box-shadow:inset 0 2px 4px rgba(36,64,44,.06);
}
.gate-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gate-opt{
  padding:15px;border-radius:16px;border:2.5px solid #d5e8c6;font-size:21px;font-weight:900;color:var(--ink);cursor:pointer;font-family:inherit;
  background:linear-gradient(180deg,#ffffff 0%,#f2f8ed 100%);
  box-shadow:0 5px 0 #bdd6ae, inset 0 2px 3px #ffffff;
}
.gate-opt:active{transform:translateY(3px);box-shadow:0 2px 0 #bdd6ae}
.gate-err{font-size:13px;font-weight:800;color:#c62828;text-align:center;min-height:18px}

/* Book List */
.book-grid{display:flex;flex-direction:column;gap:10px}
.book-item{
  width:100%;padding:15px 16px;border-radius:20px;border:2.5px solid #d7e9ca;
  background:linear-gradient(180deg,#ffffff 0%,#f6faf3 100%);
  display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;text-align:left;font-family:inherit;
  box-shadow:0 5px 0 #c2d9b4, inset 0 2px 3px #ffffff;
}
.book-item:active{transform:translateY(3px);box-shadow:0 2px 0 #c2d9b4}
.book-item.active{
  border-color:#f5b000;background:linear-gradient(180deg,#fffef4 0%,#fff3c7 100%);
  box-shadow:0 5px 0 #d99c00, inset 0 2px 3px #ffffff;
}
.book-item-title{font-size:18px;font-weight:900;color:var(--ink);line-height:1.25}
.book-item-meta{
  font-size:12.5px;font-weight:800;color:#9e5200;
  background:linear-gradient(180deg,#fff0be 0%,#ffd878 100%);
  padding:5px 11px;border-radius:999px;white-space:nowrap;flex-shrink:0;
  box-shadow:inset 0 2px 2px rgba(255,255,255,.7);
}
.filter-section{display:flex;flex-direction:column;gap:8px;padding-bottom:10px;border-bottom:2px solid #ece3cb}
.filter-row{display:flex;gap:6px;flex-wrap:wrap}
.filter-chip{
  padding:8px 14px;border-radius:999px;border:2px solid #cae2be;
  background:linear-gradient(180deg,#ffffff 0%,#f2f8ee 100%);
  font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit;
  box-shadow:0 3px 0 #bdd6b0;transition:all .12s;
}
.filter-chip.on{background:linear-gradient(180deg,#ffea92 0%,#ffd24c 100%);border-color:#f0ab00;color:#3b2600;box-shadow:0 3px 0 #cc8e00}
.filter-chip.lvl.on{background:linear-gradient(180deg,#d2fae3 0%,#8ee8b5 100%);border-color:#26bd65;color:#114a28;box-shadow:0 3px 0 #1f9b53}
.book-item-sub{font-size:12px;font-weight:800;color:#6b8773;margin-bottom:2px}
</style>
</head>
<body>

<header class="top">

    <span class="lock-dot" aria-hidden="true">

</header>

<main class="stage">

<footer class="dock">
  <button type="button" class="ctl" id="prevBtn" aria-label="이전 문장">

  <button type="button" class="ctl" id="meaningBtn" aria-label="한글로 뜻 듣기">

      <path d="M34 26 L60 -4 L86 26 Z" fill="url(#spHat)"/>

  <h1>숲속 텐트 영어 친구</h1>

</section>

<div class="modal-back center" id="gateModal">
  <div class="modal gate-box" role="dialog" aria-label="부모님 확인">
    <div class="modal-head">
      <h2>부모님 확인</h2>

<div class="modal-back" id="settingsModal">

      <h2>선생님 설정</h2>

<script>
// ========== 3D Bear Character Controller (Three.js Hybrid) ==========
const Bear3D = (() => {
  let state = { talking: false, listening: false, happy: false, micRms: 0, tapPop: 0 };
  let ready = false;
  let renderer, scene, camera, root, headGroup, mouthMesh, leftEar, rightEar;
  let normalEyesGroup, happyEyesGroup, confettiGroup, stars = [];
  let nextBlinkAt = 2.8;

  function init() {
    const wrap = document.getElementById('teacherWrap');
    const canvas = document.getElementById('bear3dCanvas');
    if (typeof THREE === 'undefined' || !canvas) {
      wrap.classList.add('fallback-mode');
      return;
    }
    try {
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'low-power' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
    } catch (e) {
      wrap.classList.add('fallback-mode');
      return;
    }

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(34, 1, 0.1, 30);
    camera.position.set(0, 0.25, 5.2);
    camera.lookAt(0, 0.12, 0);

    // Warm Clay Studio Lights
    const hemi = new THREE.HemisphereLight(0xfffdf2, 0x8bc98a, 1.15);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xfff5dc, 1.35);
    key.position.set(2.6, 4.2, 4.0);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xbbeeff, 0.65);
    rim.position.set(-3.0, 2.0, -2.5);
    scene.add(rim);

    // Clay Materials
    const furMat = new THREE.MeshStandardMaterial({ color: 0xc47e3e, roughness: 0.62, metalness: 0.02 });
    const darkFurMat = new THREE.MeshStandardMaterial({ color: 0xa56228, roughness: 0.66, metalness: 0.02 });
    const muzzleMat = new THREE.MeshStandardMaterial({ color: 0xf7dcb2, roughness: 0.58, metalness: 0.01 });
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x221b18, roughness: 0.14, metalness: 0.1 });
    const specMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const cheekMat = new THREE.MeshStandardMaterial({ color: 0xff8ea3, roughness: 0.55, transparent: true, opacity: 0.85 });
    const noseMat = new THREE.MeshStandardMaterial({ color: 0x2d1e17, roughness: 0.25 });
    const mouthMat = new THREE.MeshStandardMaterial({ color: 0xd94b54, roughness: 0.4 });
    const hatMat = new THREE.MeshStandardMaterial({ color: 0x2ba85c, roughness: 0.48, metalness: 0.04 });
    const hatRimMat = new THREE.MeshStandardMaterial({ color: 0x1e8346, roughness: 0.52 });
    const pomMat = new THREE.MeshStandardMaterial({ color: 0xffd54f, roughness: 0.35, metalness: 0.08 });
    const scarfMat = new THREE.MeshStandardMaterial({ color: 0xff6d94, roughness: 0.5 });

    root = new THREE.Group();
    scene.add(root);

    // Cute rounded torso / explorer collar
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.86, 28, 22), furMat);
    body.scale.set(1.04, 0.78, 0.88);
    body.position.set(0, -1.02, -0.06);
    root.add(body);

    const belly = new THREE.Mesh(new THREE.SphereGeometry(0.56, 24, 18), muzzleMat);
    belly.scale.set(0.95, 0.75, 0.5);
    belly.position.set(0, -1.04, 0.44);
    root.add(belly);

    const scarf = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.14, 16, 32), scarfMat);
    scarf.rotation.x = Math.PI * 0.48;
    scarf.position.set(0, -0.58, 0.02);
    root.add(scarf);

    // Head Group
    headGroup = new THREE.Group();
    headGroup.position.set(0, 0.18, 0);
    root.add(headGroup);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.98, 36, 30), furMat);
    head.scale.set(1.06, 0.98, 0.96);
    headGroup.add(head);

    // Ears
    function makeEar(side) {
      const g = new THREE.Group();
      const outer = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 20), darkFurMat);
      outer.scale.set(1, 1, 0.62);
      g.add(outer);
      const inner = new THREE.Mesh(new THREE.SphereGeometry(0.18, 18, 16), muzzleMat);
      inner.scale.set(1, 1, 0.45);
      inner.position.set(0, 0, 0.14);
      g.add(inner);
      g.position.set(side * 0.76, 0.74, -0.04);
      return g;
    }
    leftEar = makeEar(-1);
    rightEar = makeEar(1);
    headGroup.add(leftEar, rightEar);

    // Muzzle
    const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.46, 28, 22), muzzleMat);
    muzzle.scale.set(1.16, 0.86, 0.76);
    muzzle.position.set(0, -0.22, 0.76);
    headGroup.add(muzzle);

    // Nose
    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.14, 20, 16), noseMat);
    nose.scale.set(1.25, 0.82, 0.75);
    nose.position.set(0, -0.05, 1.12);
    headGroup.add(nose);

    // Normal Eyes + Specular Highlights
    normalEyesGroup = new THREE.Group();
    [-1, 1].forEach(side => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.125, 20, 16), eyeMat);
      eye.position.set(side * 0.37, 0.16, 0.87);
      normalEyesGroup.add(eye);
      const glint = new THREE.Mesh(new THREE.SphereGeometry(0.042, 12, 10), specMat);
      glint.position.set(side * 0.37 - 0.035, 0.20, 0.97);
      normalEyesGroup.add(glint);
    });
    headGroup.add(normalEyesGroup);

    // Happy Curved Eyes (for book completion)
    happyEyesGroup = new THREE.Group();
    [-1, 1].forEach(side => {
      const arc = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.035, 12, 20, Math.PI), eyeMat);
      arc.position.set(side * 0.37, 0.12, 0.92);
      happyEyesGroup.add(arc);
    });
    happyEyesGroup.visible = false;
    headGroup.add(happyEyesGroup);

    // Rosy Cheeks
    [-1, 1].forEach(side => {
      const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.15, 18, 14), cheekMat);
      cheek.scale.set(1.25, 0.78, 0.45);
      cheek.position.set(side * 0.56, -0.10, 0.80);
      headGroup.add(cheek);
    });

    // Animated Mouth
    mouthMesh = new THREE.Mesh(new THREE.SphereGeometry(0.15, 18, 14), mouthMat);
    mouthMesh.scale.set(1.15, 0.22, 0.55);
    mouthMesh.position.set(0, -0.34, 1.03);
    headGroup.add(mouthMesh);

    // Forest Tent Explorer Hat
    const hatGroup = new THREE.Group();
    hatGroup.position.set(0, 0.84, 0.02);
    hatGroup.rotation.x = -0.08;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.62, 0.76, 28), hatMat);
    cone.position.y = 0.34;
    hatGroup.add(cone);
    const brim = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.095, 14, 32), hatRimMat);
    brim.rotation.x = Math.PI / 2;
    hatGroup.add(brim);
    const pom = new THREE.Mesh(new THREE.SphereGeometry(0.13, 18, 14), pomMat);
    pom.position.y = 0.74;
    hatGroup.add(pom);
    headGroup.add(hatGroup);

    // Floating 3D Celebration Stars (visible when happy)
    confettiGroup = new THREE.Group();
    const starColors = [0xffd54f, 0xff6d94, 0x35d678, 0x64b5f6];
    for (let i = 0; i < 8; i++) {
      const s = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.11, 0),
        new THREE.MeshStandardMaterial({ color: starColors[i % starColors.length], roughness: 0.3, metalness: 0.15 })
      );
      const angle = (i / 8) * Math.PI * 2;
      s.userData = { angle, radius: 1.38 + (i % 2) * 0.18, yOff: (i % 3) * 0.25 - 0.1 };
      confettiGroup.add(s);
      stars.push(s);
    }
    confettiGroup.visible = false;
    scene.add(confettiGroup);

    function resize() {
      const rect = wrap.getBoundingClientRect();
      const size = Math.max(80, Math.round(Math.min(rect.width, rect.height)));
      renderer.setSize(size, size, false);
      camera.aspect = 1;
      camera.updateProjectionMatrix();
    }
    resize();
    window.addEventListener('resize', resize);

    wrap.addEventListener('click', () => { state.tapPop = 1.0; });

    ready = true;
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, clock.getDelta());
      const t = clock.elapsedTime;

      // Tap bounce decay
      if (state.tapPop > 0) state.tapPop = Math.max(0, state.tapPop - dt * 3.4);
      const popLift = Math.sin(state.tapPop * Math.PI) * 0.26;

      // Eyes: happy vs normal + natural blinking
      if (state.happy) {
        normalEyesGroup.visible = false;
        happyEyesGroup.visible = true;
      } else {
        normalEyesGroup.visible = true;
        happyEyesGroup.visible = false;
        if (t > nextBlinkAt) {
          const blinkPhase = (t - nextBlinkAt) / 0.14;
          if (blinkPhase < 1) {
            normalEyesGroup.scale.y = Math.max(0.08, 1 - Math.sin(blinkPhase * Math.PI));
          } else {
            normalEyesGroup.scale.y = 1;
            nextBlinkAt = t + 2.6 + Math.random() * 2.8;
          }
        }
      }

      // Base breathing & posture
      let targetY = Math.sin(t * 2.2) * 0.045 + popLift;
      let targetRotY = Math.sin(t * 1.05) * 0.12 + Math.sin(state.tapPop * Math.PI * 2) * 0.22;
      let targetRotX = 0.03;
      let targetRotZ = Math.sin(t * 0.9) * 0.035;
      let mouthOpen = 0.22;
      let earPerk = 0;

      if (state.happy) {
        targetY = Math.abs(Math.sin(t * 5.8)) * 0.28;
        targetRotY = Math.sin(t * 3.4) * 0.35;
        targetRotZ = Math.sin(t * 5.8) * 0.09;
        mouthOpen = 0.72 + Math.sin(t * 10) * 0.12;
        confettiGroup.visible = true;
        stars.forEach((s, idx) => {
          const a = s.userData.angle + t * 1.8;
          s.position.set(
            Math.cos(a) * s.userData.radius,
            0.35 + s.userData.yOff + Math.sin(t * 4 + idx) * 0.16,
            Math.sin(a) * 0.65
          );
          s.rotation.x = t * 2.5 + idx;
          s.rotation.y = t * 3.1;
        });
      } else {
        confettiGroup.visible = false;
        if (state.talking) {
          targetY += Math.abs(Math.sin(t * 7.5)) * 0.11;
          targetRotY = Math.sin(t * 3.6) * 0.16;
          targetRotX = Math.sin(t * 6.5) * 0.06;
          mouthOpen = 0.42 + Math.abs(Math.sin(t * 14.0)) * 0.65;
        } else if (state.listening) {
          const voiceBoost = Math.min(1, state.micRms * 12);
          targetRotX = 0.12 - voiceBoost * 0.06;
          targetRotZ = 0.11 + Math.sin(t * 2.4) * 0.04;
          targetRotY = Math.sin(t * 1.5) * 0.08;
          earPerk = 0.16 + voiceBoost * 0.18;
          mouthOpen = 0.28 + voiceBoost * 0.22;
        }
      }

      root.position.y += (targetY - root.position.y) * 0.22;
      headGroup.rotation.y += (targetRotY - headGroup.rotation.y) * 0.16;
      headGroup.rotation.x += (targetRotX - headGroup.rotation.x) * 0.16;
      headGroup.rotation.z += (targetRotZ - headGroup.rotation.z) * 0.16;
      mouthMesh.scale.y += (mouthOpen - mouthMesh.scale.y) * 0.35;
      leftEar.rotation.z += (earPerk - leftEar.rotation.z) * 0.2;
      rightEar.rotation.z += (-earPerk - rightEar.rotation.z) * 0.2;

      renderer.render(scene, camera);
    }
    animate();
  }

  return {
    init,
    setState(patch) { Object.assign(state, patch); },
    isReady() { return ready; }
  };
})();

// ========== Modular Phonics Engine (Stage 1: Rule-based + Live, Stage 2-ready for 44 MP3s) ==========
const PhonicsEngine = (() => {
  const SIGHT_WORDS = new Set([
    'i','a','the','to','do','does','done','go','goes','no','so','he','she','we','me','be',
    'my','by','of','for','from','are','was','were','is','his','has','have','said','says',
    'you','your','they','their','there','here','where','what','who','why','one','two','four',
    'eight','come','some','love','give','live','could','would','should','put','pull','push',
    'full','all','water','want','watch','walk','talk','friend','people','because','again',
    'very','any','many','been','into','onto','only','other','mother','father','brother',
    'eye','eyes','shoe','shoes','once','buy','laugh','through','thought','enough','beautiful'
  ]);

  const MULTI_GRAPHEMES = [
    'ough','augh','eigh','tion','sion','ture',
    'igh','tch','dge','air','ear','eer','ore','oor','our','ire',
    'sh','ch','th','wh','ph','ck','ng','nk','qu','kn','wr','mb','gh',
    'ee','ea','ai','ay','oa','oe','oo','ou','ow','oi','oy','au','aw','ew','ue','ui','ie','ey',
    'ar','er','ir','or','ur',
    'll','ss','ff','zz','tt','pp','dd','bb','gg','mm','nn','rr'
  ];

  function cleanWord(raw) {
    return String(raw || '').replace(/^[^a-zA-Z']+|[^a-zA-Z']+$/g, '');
  }

  function analyze(raw) {
    const clean = cleanWord(raw);
    const lower = clean.toLowerCase();
    if (!lower) return { isSight: true, word: '', chunks: [] };
    if (lower.length <= 1 || SIGHT_WORDS.has(lower) || lower.includes("'")) {
      return { isSight: true, word: clean, chunks: [clean] };
    }

    const chunks = [];
    let i = 0;
    const n = lower.length;
    while (i < n) {
      // Magic-e check: remaining 3 letters are [vowel][single consonant]e (e.g. ake, ine, one, ome, ide)
      if (n - i === 3 && /^[aeiou][^aeiouwy]e$/.test(lower.slice(i))) {
        chunks.push(clean.slice(i, i + 1));
        chunks.push(clean.slice(i + 1, i + 3));
        break;
      }
      let matched = '';
      for (const g of MULTI_GRAPHEMES) {
        if (lower.startsWith(g, i)) {
          matched = clean.slice(i, i + g.length);
          break;
        }
      }
      if (matched) {
        chunks.push(matched);
        i += matched.length;
      } else {
        chunks.push(clean[i]);
        i += 1;
      }
    }

    if (chunks.length <= 1) {
      return { isSight: true, word: clean, chunks: [clean] };
    }
    return { isSight: false, word: clean, chunks };
  }

  return { analyze, cleanWord };
})();

// ---------- 책 목록 ----------
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function buildBooks(rows) {
  const map = new Map();
  rows.forEach((r, i) => {
    let series = '기본 시리즈', level = '전체', title = '', ord = NaN, en = '';
    if (r.length >= 5 && !isNaN(parseInt(r[3], 10))) {
      series = (r[0] || '').trim() || '기타';
      level = (r[1] || '').trim() || '기본';
      title = (r[2] || '').trim();
      ord = parseInt(r[3], 10);
      en = (r[4] || '').trim();
    } else {
      title = (r[0] || '').trim();
      ord = parseInt(r[1], 10);
      en = (r[2] || '').trim();
    }
    if (!title || !en || isNaN(ord)) return;
    const key = `${series}||${level}||${title}`;
    if (!map.has(key)) map.set(key, { series, level, title, list: [] });
    map.get(key).list.push({ ord, i, en });
  });
  return [...map.values()].map(item => ({
    series: item.series,
    level: item.level,
    title: item.title,
    sentences: item.list.sort((a, b) => a.ord - b.ord || a.i - b.i).map(x => x.en)
  }));
}
async function fetchBooks(url) {
  if (!url) return [SAMPLE_BOOK];
  let text;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    text = await res.text();
  } catch (e) {
    throw new Error('책 목록을 가져오지 못했어요. 시트를 "웹에 게시(CSV)"했는지 확인해 주세요.');
  }
  const list = buildBooks(parseCsv(text));
  if (!list.length) throw new Error('책 목록을 찾지 못했어요. 시트 열 순서를 확인해 주세요.');
  return list;
}

// ---------- 오디오 출력 ----------
function ensureOut() {
  if (!outCtx) outCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
  if (outCtx.state === 'suspended') outCtx.resume();
  return outCtx;
}
function warmUpAudio() {
  const ctx = ensureOut();
  try {
    const silentBuf = ctx.createBuffer(1, 1200, 24000);
    const src = ctx.createBufferSource();
    src.buffer = silentBuf;
    src.connect(ctx.destination);
    src.start(ctx.currentTime);
  } catch (e) {}
}
function playFanfare() {
  const ctx = ensureOut();
  const notes = [523.25, 659.25, 783.99, 1046.50];
  const now = ctx.currentTime + 0.02;
  notes.forEach((freq, idx) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now + idx * 0.11);
    gain.gain.setValueAtTime(0.001, now + idx * 0.11);
    gain.gain.exponentialRampToValueAtTime(0.18, now + idx * 0.11 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.11 + (idx === 3 ? 0.55 : 0.22));
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now + idx * 0.11);
    osc.stop(now + idx * 0.11 + (idx === 3 ? 0.6 : 0.25));
  });
}
function flushCaption() {
  if (!teacherText || wordMode || suppressCaption) return;
  const cap = $('caption');
  cap.textContent = teacherText;
  cap.classList.add('show');
}
function scheduleFloat32Chunk(f32) {
  const ctx = ensureOut();
  const buf = ctx.createBuffer(1, f32.length, 24000);
  buf.getChannelData(0).set(f32);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  const now = ctx.currentTime;
  if (!firstAudioStarted || playAt < now) playAt = now + 0.03;
  const startAt = playAt;
  src.start(startAt);
  playAt += buf.duration;

  if (!firstAudioStarted) {
    firstAudioStarted = true;
    const delayMs = Math.max(0, (startAt - now) * 1000);
    clearTimeout(captionTimer);
    captionTimer = setTimeout(() => {
      flushCaption();
      updateVisualState(true);
      if (phonicsMode && phonicsInfo && !phonicsInfo.isSight && !phonicsTimers.length) {
        startPhonicsLightSequence(null);
      }
    }, delayMs);
  } else {
    flushCaption();
    updateVisualState(true);
  }

  sources.push(src);
  src.onended = () => {
    sources = sources.filter(s => s !== src);
    if (!sources.length) {
      firstAudioStarted = false;
      if (phonicsMode && phonicsInfo && !phonicsInfo.isSight) {
        clearPhonicsTimers();
        setPhonicsLit(phonicsInfo.chunks.length);
      }
      updateVisualState(false);
    }
  };
}
function playPcm(b64) {
  const bin = atob(b64), len = bin.length >> 1, f = new Float32Array(len);
  for (let i = 0; i < len; i++) {
    let v = bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8);
    if (v >= 0x8000) v -= 0x10000;
    f[i] = v / 32768;
  }
  if (activeCacheKey) currentTurnChunks.push(f);
  scheduleFloat32Chunk(f);
}
function playCachedChunks(chunks, triggerAutoNext = false, isPhonics = false) {
  stopPlayback();
  firstAudioStarted = false;
  if (outCtx) playAt = outCtx.currentTime;
  let totalSamples = 0;
  for (const f of chunks) {
    totalSamples += f.length;
    scheduleFloat32Chunk(f);
  }
  if (isPhonics && phonicsInfo && !phonicsInfo.isSight) {
    const totalMs = Math.max(900, (totalSamples / 24000) * 1000);
    startPhonicsLightSequence(totalMs);
  }
  if (triggerAutoNext && autoReadMode && index >= 0 && !finished && !wordMode) {
    scheduleNextStep(1500);
  }
}
function clearPhonicsTimers() {
  phonicsTimers.forEach(id => clearTimeout(id));
  phonicsTimers = [];
}
function setPhonicsLit(idx) {
  phonicsLitIndex = idx;
  const box = $('wordMeaningBox');
  if (!box) return;
  box.querySelectorAll('.p-chunk').forEach((el, i) => el.classList.toggle('lit', i === idx));
  const wholeEl = box.querySelector('.p-whole');
  if (wholeEl) wholeEl.classList.toggle('lit', phonicsInfo && idx === phonicsInfo.chunks.length);
}
function startPhonicsLightSequence(exactTotalMs) {
  clearPhonicsTimers();
  if (!phonicsInfo || phonicsInfo.isSight) return;
  const n = phonicsInfo.chunks.length;
  const speedStep = [740, 620, 520, 440][cfg.speed] || 520;
  const chunkDur = exactTotalMs ? Math.max(260, (exactTotalMs * 0.68) / n) : speedStep;
  const wholeAt = exactTotalMs ? Math.max(n * chunkDur + 80, exactTotalMs * 0.72) : (n * chunkDur + 260);

  for (let i = 0; i < n; i++) {
    phonicsTimers.push(setTimeout(() => {
      if (phonicsMode) setPhonicsLit(i);
    }, Math.round(i * chunkDur)));
  }
  phonicsTimers.push(setTimeout(() => {
    if (phonicsMode) setPhonicsLit(n);
  }, Math.round(wholeAt)));
}
function stopPlayback() {
  clearTimeout(autoReadTimer);
  clearTimeout(captionTimer);
  clearPhonicsTimers();
  sources.forEach(s => { try { s.stop(); } catch (e) {} });
  sources = [];
  firstAudioStarted = false;
  if (outCtx) playAt = outCtx.currentTime;
  updateVisualState(false);
}

// ---------- 마이크 + 소음 게이트 + 3D 음량 피드백 ----------
async function startMic() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    inCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    const src = inCtx.createMediaStreamSource(micStream);
    micNode = inCtx.createScriptProcessor(4096, 1, 1);
    micNode.onaudioprocess = e => {
      const canListen = isMicListeningNow();
      const input = e.inputBuffer.getChannelData(0);
      let sum = 0;
      for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
      const rms = Math.sqrt(sum / input.length);

      if (canListen) {
        const scale = Math.min(1.22, 1.03 + rms * 2.1);
        $('teacherWrap').style.setProperty('--mic-scale', scale.toFixed(3));
        Bear3D.setState({ micRms: rms });
      } else {
        $('teacherWrap').style.setProperty('--mic-scale', '1');
        Bear3D.setState({ micRms: 0 });
        return;
      }

      const nowMs = performance.now();
      if (cfg.micMode === 'always') {
        if (rms > 0.016) voiceActiveUntil = nowMs + 950;
        if (nowMs > voiceActiveUntil) return;
      }

      const out = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      const bytes = new Uint8Array(out.buffer);
      let bin = '';
      for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      send({ realtimeInput: { audio: { data: btoa(bin), mimeType: 'audio/pcm;rate=16000' } } });
    };
    src.connect(micNode);
    micNode.connect(inCtx.destination);
    return true;
  } catch (e) {
    stopMic();
    return false;
  }
}
function stopMic() {
  if (micNode) { try { micNode.disconnect(); } catch (e) {} micNode.onaudioprocess = null; micNode = null; }
  if (inCtx) { try { inCtx.close(); } catch (e) {} inCtx = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
}
function isMicListeningNow() {
  if (!connected || !setupDone || introPending || sources.length || turnInFlight || autoReadMode) return false;
  if (cfg.micMode === 'always' || cfg.micMode === 'toggle') return micOn;
  return pushing;
}

async function startSession(preserveState = false) {
  if (!cfg.apiKey.trim()) { openSettings('먼저 API 키를 넣어 주세요.'); return; }
  const savedIdx = preserveState ? index : -1;
  const savedFin = preserveState ? finished : false;
  silentReconnect = preserveState;
  closeSession(preserveState);
  index = savedIdx;
  finished = savedFin;

  warmUpAudio();
  requestWakeLock();
  if (!preserveState) {
    setPhase('loading');
    setTurnBanner('선생님을 부르는 중이에요...', 'talking');
  }
  if (!micStream) {
    const micOk = await startMic();
    micOn = micOk && cfg.micMode === 'always';
    if (!micOk && !preserveState) setTurnBanner('마이크 없이 듣기 모드로 시작해요', 'auto');
  } else {
    micOn = cfg.micMode === 'always';
  }

  const sock = new WebSocket(wsUrl(cfg.apiKey.trim()));
  ws = sock;
  sock.onopen = () => {
    if (ws !== sock) return;
    connected = true;
    reconnectAttempts = 0;
    turnCountInSession = 0;
    sock.send(JSON.stringify(setupMessage()));
    renderDock();
  };
  sock.onmessage = async ev => {
    if (ws !== sock) return;
    let raw = ev.data;
    if (raw instanceof Blob) raw = await raw.text();
    let msg;
    try { msg = JSON.parse(raw); } catch (e) { return; }
    handle(msg);
  };
  sock.onerror = () => { if (ws === sock && !silentReconnect) fail('연결에 실패했어요. 인터넷과 API 키를 확인해 주세요.'); };
  sock.onclose = e => {
    if (ws !== sock) return;
    connected = false;
    setupDone = false;
    if (phase === 'ready' && reconnectAttempts < 2 && e.code !== 1000) {
      reconnectAttempts += 1;
      setTurnBanner('잠시 연결을 다시 잇고 있어요...', 'talking');
      setTimeout(() => {
        if (phase === 'ready' && !connected) startSession(true);
      }, 900);
      return;
    }
    fail('연결이 끊겼어요. 시작하기를 다시 눌러 주세요. (코드 ' + e.code + ')');
  };
}

function closeSession(keepProgress = false) {
  const s = ws;
  ws = null; connected = false; setupDone = false; introPending = false; pendingAutoNext = false;
  pendingTurns = 0; turnInFlight = false; activeCacheKey = ''; currentTurnChunks = [];
  if (!keepProgress) {
    index = -1;
    finished = false;
    audioCache.clear();
    selectedWord = ''; selectedWordMeaning = ''; wordMode = false;
    stopMic();
    releaseWakeLock();
  }
  clearTimeout(introTimer);
  clearTimeout(autoReadTimer);
  clearTimeout(captionTimer);
  pushing = false;
  if (!keepProgress) micOn = false;
  if (s) { try { s.close(1000); } catch (e) {} }
  stopPlayback();
  teacherText = '';
  $('caption').classList.remove('show');
  $('caption').textContent = '';
  $('childLine').textContent = '';
}

function fail(msg) {
  silentReconnect = false;
  closeSession(false);
  setPhase('splash');
  $('splashMsg').textContent = msg;
}

function maybeRefreshSession() {
  if (turnCountInSession >= MAX_TURNS_BEFORE_REFRESH && !sources.length && !turnInFlight && connected && phase === 'ready') {
    turnCountInSession = 0;
    startSession(true);
  }
}

function scheduleNextStep(delayAfterAudioMs) {
  const waitAndGo = () => {
    if (!pendingAutoNext && !autoReadMode) return;
    if (sources.length > 0 || turnInFlight) {
      autoReadTimer = setTimeout(waitAndGo, 150);
      return;
    }
    pendingAutoNext = false;
    autoReadTimer = setTimeout(() => {
      if (canUse() && index >= 0 && !finished) go(1);
    }, delayAfterAudioMs);
  };
  autoReadTimer = setTimeout(waitAndGo, 200);
}

function handle(msg) {
  if (msg.error) return fail('선생님 연결에 문제가 생겼어요: ' + (msg.error.message || '알 수 없는 오류'));
  if (msg.setupComplete) {
    setupDone = true;
    if (silentReconnect) {
      silentReconnect = false;
      setPhase('ready');
      updateVisualState(false);
      return;
    }
    sayIntro();
    return;
  }

  const isStaleTurn = pendingTurns > 1;

  if (msg.toolCall && Array.isArray(msg.toolCall.functionCalls)) {
    const responses = [];
    for (const fc of msg.toolCall.functionCalls) {
      if (fc.name === 'move_to_next_sentence') {
        if (!isStaleTurn) pendingAutoNext = true;
        responses.push({ id: fc.id, name: fc.name, response: { result: 'ok' } });
      } else if (fc.name === 'show_word_meaning') {
        const args = fc.args || {};
        if (!isStaleTurn && args.meaning) {
          selectedWordMeaning = String(args.meaning).trim();
          if (activeCacheKey) {
            const existing = audioCache.get(activeCacheKey) || { chunks: [] };
            existing.meaning = selectedWordMeaning;
            audioCache.set(activeCacheKey, existing);
          }
          renderWordMeaningBox();
        }
        responses.push({ id: fc.id, name: fc.name, response: { result: 'ok' } });
      }
    }
    if (responses.length > 0) send({ toolResponse: { functionResponses: responses } });
    return;
  }

  const sc = msg.serverContent;
  if (!sc) return;

  if (sc.interrupted) {
    pendingAutoNext = false;
    if (pendingTurns > 0) pendingTurns -= 1;
    turnInFlight = pendingTurns > 0;
    stopPlayback();
  }

  if (pendingTurns > 1) {
    if (sc.turnComplete) {
      pendingTurns = Math.max(0, pendingTurns - 1);
      turnInFlight = pendingTurns > 0;
    }
    return;
  }

  if (sc.inputTranscription && sc.inputTranscription.text) {
    $('childLine').textContent = '내 목소리: ' + sc.inputTranscription.text;
  }
  if (sc.outputTranscription && sc.outputTranscription.text) {
    if (newTurn) { teacherText = ''; newTurn = false; }
    teacherText += sc.outputTranscription.text;
    if (firstAudioStarted) flushCaption();
  }
  for (const part of (sc.modelTurn && sc.modelTurn.parts) || []) {
    if (part.inlineData && String(part.inlineData.mimeType || '').startsWith('audio/pcm')) {
      playPcm(part.inlineData.data);
    }
  }
  if (sc.turnComplete) {
    pendingTurns = Math.max(0, pendingTurns - 1);
    turnInFlight = pendingTurns > 0;
    turnCountInSession += 1;

    if (activeCacheKey && currentTurnChunks.length > 0) {
      const prev = audioCache.get(activeCacheKey) || {};
      audioCache.set(activeCacheKey, {
        chunks: currentTurnChunks.slice(),
        meaning: prev.meaning || selectedWordMeaning || ''
      });
    }
    activeCacheKey = '';
    currentTurnChunks = [];

    if (teacherText && !firstAudioStarted) flushCaption();
    newTurn = true;
    $('childLine').textContent = '';

    if (cfg.micMode === 'toggle' && micOn && !wordMode && !suppressCaption) {
      micOn = false;
      renderDock();
    }

    if (introPending) {
      introPending = false;
      clearTimeout(introTimer);
      setPhase('ready');
      if (autoReadMode) startBook();
      else setTurnBanner('책 읽기 시작을 눌러 주세요', 'auto');
    } else if (pendingAutoNext) {
      scheduleNextStep(450);
    } else if (autoReadMode && index >= 0 && !finished && !wordMode) {
      scheduleNextStep(1500);
    } else {
      updateVisualState(sources.length > 0);
      if (!sources.length) maybeRefreshSession();
    }
  }
}

function sendText(text, isWordReq = false, cacheKey = '', hideCap = false) {
  clearTimeout(autoReadTimer);
  pendingTurns += 1;
  turnInFlight = true;
  activeCacheKey = cacheKey;
  currentTurnChunks = [];
  wordMode = isWordReq;
  suppressCaption = hideCap;
  teacherText = ''; newTurn = false; firstAudioStarted = false;
  $('caption').classList.remove('show');
  $('caption').textContent = '';
  reqSeq += 1;
  const v = VOICES[cfg.voice] || VOICES.female;
  const sp = (SPEEDS[cfg.speed] || SPEEDS[2]).text;
  const voiceTag = `[#${reqSeq} | 고정화자:${v.voice}(${v.label}) | 고정속도:${sp}]`;
  send({ clientContent: { turns: [{ role: 'user', parts: [{ text: `${voiceTag} ${text}` }] }], turnComplete: true } });
}

function sayIntro() {
  const nm = cfg.childName.trim();
  const greet = pickTimeGreeting(nm ? nm + '! ' : '');
  const intro = pick(INTROS)(book ? book.title : '오늘의 책');
  introPending = true;
  setPhase('loading');
  setTurnBanner('선생님이 인사하고 있어요', 'talking');
  clearTimeout(introTimer);
  introTimer = setTimeout(() => {
    if (introPending) {
      introPending = false;
      pendingTurns = 0;
      turnInFlight = false;
      setPhase('ready');
      if (autoReadMode) startBook();
      else setTurnBanner('책 읽기 시작을 눌러 주세요', 'auto');
    }
  }, 18000);
  sendText(`GREET: ${greet} ${intro}`, false, '', false);
}

// ---------- 계속 읽기 모드 토글 ----------
function toggleAutoRead() {
  autoReadMode = !autoReadMode;
  clearTimeout(autoReadTimer);
  pendingAutoNext = false;
  wordMode = false;

  renderDock();

      if (index < 0) startBook();

  }
}
function renderAutoButton() {

  btn.classList.toggle('auto', autoReadMode);

// ---------- 읽기 흐름 ----------
function clearWordSelection() {
  clearPhonicsTimers();
  selectedWord = '';
  selectedWordMeaning = '';
  wordMode = false;
  phonicsMode = false;
  phonicsInfo = null;
  phonicsLitIndex = -1;
}
function startBook() {
  if (!canUse()) return;
  finished = false;
  index = 0;
  clearWordSelection();
  readSentence();
}
function readSentence(forceFresh = false) {
  if (!canUse() || index < 0 || finished) return;
  stopPlayback();
  clearWordSelection();
  const sentence = book.sentences[index];
  const cacheKey = `S:${cfg.voice}:${cfg.speed}:${sentence}`;
  const cached = audioCache.get(cacheKey);
  if (!forceFresh && cached && cached.chunks && cached.chunks.length > 0) {
    suppressCaption = true;
    $('caption').classList.remove('show');
    renderAll();
    playCachedChunks(cached.chunks, true);
    return;
  }
  sendText(`READ_SENTENCE: ${sentence}`, false, cacheKey, true);
  renderAll();
}
function readWord(cleanWord, displayWord) {
  if (!canUse() || index < 0 || finished || !cleanWord) return;
  stopPlayback();
  if (autoReadMode) {
    autoReadMode = false;
    renderAutoButton();
    renderDock();
  }
  const sentence = book.sentences[index];
  const cacheKey = `W:${cfg.voice}:${cfg.speed}:${cfg.wordKoMode}:${sentence}:${cleanWord.toLowerCase()}`;
  const cached = audioCache.get(cacheKey);
  selectedWord = displayWord;
  wordMode = true;
  phonicsMode = false;
  phonicsInfo = null;
  phonicsLitIndex = -1;

  if (cached && cached.chunks && cached.chunks.length > 0) {
    selectedWordMeaning = cached.meaning || '';
    renderCard();
    playCachedChunks(cached.chunks, false);
    return;
  }

  selectedWordMeaning = '뜻 찾는 중...';
  renderCard();
  sendText(`READ_WORD: "${cleanWord}" (문맥: "${sentence}")`, true, cacheKey, true);
}
function speakWordMeaning() {
  if (!canUse() || !selectedWordMeaning || selectedWordMeaning === '뜻 찾는 중...') return;
  stopPlayback();
  const cacheKey = `WK:${cfg.voice}:${selectedWordMeaning}`;
  const cached = audioCache.get(cacheKey);
  if (cached && cached.chunks && cached.chunks.length > 0) {
    playCachedChunks(cached.chunks, false);
    return;
  }
  sendText(`SPEAK_KO: ${selectedWordMeaning}`, true, cacheKey, true);
}
function readPhonics(forceFresh = false) {
  if (!canUse() || !selectedWord || index < 0 || finished) return;
  stopPlayback();
  if (autoReadMode) {
    autoReadMode = false;
    renderAutoButton();
    renderDock();
  }
  const info = PhonicsEngine.analyze(selectedWord);
  if (!info.word) return;
  wordMode = true;
  phonicsMode = true;
  phonicsInfo = info;
  phonicsLitIndex = -1;

  const keyLower = info.word.toLowerCase();
  const cacheKey = `P:${cfg.voice}:${cfg.speed}:${info.isSight ? 'S' : 'G'}:${keyLower}`;
  if (forceFresh) {
    audioCache.delete(cacheKey);
  }
  const cached = audioCache.get(cacheKey);
  renderWordMeaningBox();

  if (!forceFresh && cached && cached.chunks && cached.chunks.length > 0) {
    playCachedChunks(cached.chunks, false, !info.isSight);
    return;
  }

  if (forceFresh) {
    setTurnBanner('새로 쪼개 읽기를 요청했어요', 'talking');
  }
  if (info.isSight) {
    sendText(`READ_SIGHT_WORD: "${info.word}"`, true, cacheKey, true);
  } else {
    const seqStr = info.chunks.join(' · ');
    sendText(`PHONICS_WORD: "${seqStr} -> ${info.word}"`, true, cacheKey, true);
  }
}
function closePhonicsView() {
  clearPhonicsTimers();
  phonicsMode = false;
  phonicsInfo = null;
  phonicsLitIndex = -1;
  renderWordMeaningBox();
}
function finishBook() {
  if (!canUse()) return;
  stopPlayback();
  clearWordSelection();
  finished = true;
  playFanfare();
  renderAll();
  const nm = cfg.childName.trim();
  const who = nm ? `${nm}! ` : '';
  setTimeout(() => {
    if (!finished) return;
    sendText(`CELEBRATE: ${who}우와, "${book.title}" 책을 끝까지 다 읽었어! 정말 최고야, 참 잘했어!`, false, '', false);
  }, 650);
}
function go(delta) {
  if (!canUse()) return;
  pendingAutoNext = false;
  clearTimeout(autoReadTimer);
  clearWordSelection();
  if (finished) {
    if (delta < 0) {
      finished = false;
      index = book.sentences.length - 1;
      readSentence();
    }
    return;
  }
  if (index < 0) { if (delta > 0) startBook(); return; }
  const next = index + delta;
  if (next < 0) {
    setTurnBanner('첫 문장이에요', 'auto');
    return;
  }
  if (next >= book.sentences.length) {
    finishBook();
    return;
  }
  index = next;
  readSentence();
}
function meaning() {
  if (!canUse() || index < 0 || finished) return;
  stopPlayback();
  clearWordSelection();
  if (autoReadMode) {
    autoReadMode = false;
    renderAutoButton();
  }
  const sentence = book.sentences[index];
  const cacheKey = `M:${cfg.voice}:${sentence}`;
  const cached = audioCache.get(cacheKey);
  if (cached && cached.chunks && cached.chunks.length > 0) {
    renderAll();
    playCachedChunks(cached.chunks, false);
    return;
  }
  sendText(`MEANING: "${sentence}"`, false, cacheKey, false);
  renderAll();
}

// ---------- 화면 및 3D 시각 피드백 ----------
function setPhase(p) {
  phase = p;
  $('splash').classList.toggle('hide', p !== 'splash');
  renderAll();
}
function setTurnBanner(text, mode) {
  const pill = $('turnPill');
  const label = $('turnText');
  if (!text) {
    pill.className = 'turn-pill hidden';
    label.textContent = '';
    return;
  }
  pill.className = 'turn-pill ' + (mode || '');
  label.textContent = text;
}
function updateVisualState(isTalking) {
  const wrap = $('teacherWrap');
  const card = $('card');
  wrap.classList.toggle('talking', isTalking);

  const listening = !isTalking && isMicListeningNow() && index >= 0 && !finished;
  wrap.classList.toggle('listening', listening);
  card.classList.toggle('listening-active', listening);

  Bear3D.setState({ talking: isTalking, listening, happy: finished });

  if (!connected || !setupDone || introPending) return;
  if (isTalking) {
    if (phonicsMode && phonicsInfo) {
      setTurnBanner(phonicsInfo.isSight ? `"${phonicsInfo.word}" 통째로 읽는 단어예요` : `"${phonicsInfo.word}" 소리를 쪼개어 들어 봐요`, 'talking');
    } else if (wordMode) setTurnBanner(`"${selectedWord}" 발음을 들려주고 있어요`, 'talking');
    else if (autoReadMode) setTurnBanner('선생님이 계속 읽어주고 있어요', 'talking');
    else setTurnBanner('선생님 목소리를 잘 들어 봐요', 'talking');
  } else if (finished) {
    setTurnBanner('책을 끝까지 다 읽었어요!', 'talking');
  } else if (autoReadMode && index >= 0 && !wordMode) {
    setTurnBanner('잠시 뒤 다음 문장을 읽어요...', 'auto');
  } else if (listening) {
    setTurnBanner('내 차례예요! 크게 따라 말해 봐요', 'listening');
  } else if (index >= 0) {
    if (cfg.micMode === 'toggle') setTurnBanner('말하기 버튼을 눌러 따라 말해 봐요', 'auto');
    else if (cfg.micMode === 'push') setTurnBanner('말하기 버튼을 누른 채 말해 봐요', 'auto');
    else setTurnBanner('마이크가 꺼져 있어요', 'auto');
  } else {
    setTurnBanner('책 읽기 시작을 눌러 주세요', 'auto');
  }
}
function renderAll() {
  $('bookTitle').textContent = book ? book.title : '책을 골라 주세요';
  renderAutoButton();
  renderCard();
  renderDots();
  renderDock();

}

  wrap.innerHTML = book.sentences.map((_, i) => {

function renderWordMeaningBox() {

    }).join('<span class="p-dot">·</span>');

    box.innerHTML = `<div class="word-tools-row">

        ${chunksHtml}
        <span class="p-arrow">→</span>
        <span class="p-whole${wholeLit}">${esc(phonicsInfo.word)}</span>
      </div>
      <button type="button" class="back-meaning-btn" data-act="back-meaning">뜻</button>
    </div>`;

    <button type="button" class="phonics-btn" data-act="phonics" title="짧게 누르면 쪼개 듣기 · 길게 누르면 새로 듣기">쪼개 듣기</button>

    : (pushing ? '말하는 중' : '누르고 말해요');
