<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>알파랜드 음절 스테이지 파닉스 (852 단어)</title>
<style>
  :root {
    --bg-forest-1: #132a1e;
    --bg-forest-2: #1f3d2b;
    --card-bg: #fffdf7;
    --card-border: #e6dcc8;
    --ink: #1e293b;
    --muted: #64748b;
    --accent-amber: #d97706;
    --accent-amber-soft: #fef3c7;
    --accent-green: #15803d;
    --accent-green-soft: #dcfce7;
    --accent-red: #b91c1c;
    --accent-red-soft: #fee2e2;
    --accent-blue: #0369a1;
    --accent-blue-soft: #e0f2fe;
    --shadow-3d: 0 6px 0 rgba(15, 23, 42, 0.14), 0 12px 24px rgba(15, 23, 42, 0.12);
    --shadow-btn: 0 4px 0 rgba(15, 23, 42, 0.18);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: linear-gradient(160deg, var(--bg-forest-1) 0%, var(--bg-forest-2) 55%, #2b4c35 100%);
    color: var(--ink);
  }

  .app-shell {
    max-width: 820px;
    margin: 0 auto;
    padding: 12px 14px 28px;
  }

  /* Top Header & Controls */
  .top-bar {
    background: rgba(255, 253, 247, 0.96);
    border: 2px solid var(--card-border);
    border-radius: 18px;
    padding: 12px 14px;
    box-shadow: var(--shadow-3d);
    margin-bottom: 12px;
  }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .brand-title {
    font-size: 1.05rem;
    font-weight: 800;
    color: #14532d;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .word-counter {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    background: #f1f5f9;
    padding: 4px 10px;
    border-radius: 999px;
  }

  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .filter-btn {
    border: 1.5px solid #cbd5e1;
    background: #ffffff;
    color: var(--ink);
    font-size: 0.8rem;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }

  .filter-btn.active {
    background: #14532d;
    color: #ffffff;
    border-color: #14532d;
  }

  .search-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
  }

  .search-input, .word-select {
    width: 100%;
    padding: 8px 11px;
    border-radius: 10px;
    border: 1.5px solid #cbd5e1;
    font-size: 0.88rem;
    background: #fff;
    color: var(--ink);
  }

  .word-select {
    max-width: 175px;
    font-weight: 700;
  }

  .mini-btn {
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.84rem;
    font-weight: 800;
    cursor: pointer;
    background: #f59e0b;
    color: #fff;
    box-shadow: 0 3px 0 #b45309;
  }

  .mini-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #b45309;
  }

  /* Main Stage Card */
  .stage-card {
    background: var(--card-bg);
    border: 2.5px solid var(--card-border);
    border-radius: 22px;
    padding: 16px 16px 20px;
    box-shadow: var(--shadow-3d);
  }

  .word-meta-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .badge-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .sw-badge {
    font-size: 0.78rem;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 999px;
  }

  .sw-core { background: var(--accent-red-soft); color: var(--accent-red); }
  .sw-heart { background: var(--accent-amber-soft); color: var(--accent-amber); }
  .sw-decode { background: var(--accent-green-soft); color: var(--accent-green); }

  .cat-badge {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 999px;
    background: #e2e8f0;
    color: #334155;
  }

  .ep-info {
    font-size: 0.76rem;
    color: var(--muted);
    font-weight: 600;
  }

  .word-headline {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    padding-bottom: 10px;
    border-bottom: 1.5px dashed #e2e8f0;
  }

  .target-word {
    font-size: 2rem;
    font-weight: 900;
    color: #0f172a;
    letter-spacing: 0.5px;
  }

  .target-ko {
    font-size: 1.05rem;
    font-weight: 700;
    color: #334155;
  }

  .target-ipa {
    font-size: 0.9rem;
    color: var(--accent-blue);
    font-weight: 700;
  }

  /* Syllable Overview Chips (Never wraps excessively) */
  .syl-strip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 14px 0 10px;
  }

  .syl-chip {
    border: 2px solid #cbd5e1;
    background: #f8fafc;
    color: #334155;
    font-size: 0.92rem;
    font-weight: 800;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .syl-chip.active {
    background: #d97706;
    color: #ffffff;
    border-color: #b45309;
    transform: scale(1.05);
  }

  .syl-chip.done {
    background: #dcfce7;
    color: #166534;
    border-color: #86efac;
  }

  .syl-chip.all-chip.active {
    background: #0369a1;
    border-color: #075985;
  }

  /* Step Indicator */
  .step-banner {
    text-align: center;
    font-size: 0.9rem;
    font-weight: 800;
    color: #14532d;
    background: #f0fdf4;
    border: 1.5px solid #bbf7d0;
    border-radius: 12px;
    padding: 8px 12px;
    margin-bottom: 14px;
  }

  /* Character Stage — Single Syllable Focus (No overflow on mobile!) */
  .character-stage {
    min-height: 175px;
    background: radial-gradient(circle at top, #ffffff 0%, #f8fafc 100%);
    border: 2px solid #e2e8f0;
    border-radius: 18px;
    padding: 14px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: nowrap;
    overflow: hidden;
  }

  .character-stage.overview-mode {
    gap: 6px;
    padding: 10px 8px;
  }

  .block-unit {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 68px;
    max-width: 112px;
    flex: 0 1 auto;
    padding: 8px 6px 6px;
    border-radius: 16px;
    background: #ffffff;
    border: 2px solid #cbd5e1;
    box-shadow: 0 4px 0 #cbd5e1;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .character-stage.overview-mode .block-unit {
    min-width: 44px;
    max-width: 72px;
    padding: 5px 4px;
    border-radius: 12px;
  }

  .block-unit.team-unit {
    border-color: #3b82f6;
    background: #eff6ff;
    box-shadow: 0 4px 0 #93c5fd;
  }

  .block-unit.magic-unit {
    border-color: #a855f7;
    background: #faf5ff;
    box-shadow: 0 4px 0 #d8b4fe;
  }

  .block-unit.silent-unit {
    opacity: 0.48;
    border-style: dashed;
    background: #f1f5f9;
    box-shadow: none;
  }

  .block-unit.speaking {
    transform: translateY(-10px) scale(1.08);
    border-color: #ea580c;
    box-shadow: 0 10px 18px rgba(234, 88, 12, 0.28);
    z-index: 2;
  }

  .unit-tag {
    position: absolute;
    top: -9px;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .tag-team { background: #2563eb; color: #fff; }
  .tag-magic { background: #7e22ce; color: #fff; }
  .tag-silent { background: #64748b; color: #fff; }

  .char-pair {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .char-img {
    width: 56px;
    height: 64px;
    object-fit: contain;
    display: block;
  }

  .character-stage.overview-mode .char-img {
    width: 34px;
    height: 40px;
  }

  .char-fallback {
    width: 54px;
    height: 62px;
    border-radius: 12px;
    background: #fef3c7;
    border: 2px solid #f59e0b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 900;
    color: #92400e;
  }

  .unit-grapheme {
    margin-top: 4px;
    font-size: 0.92rem;
    font-weight: 900;
    color: #0f172a;
  }

  .character-stage.overview-mode .unit-grapheme {
    font-size: 0.72rem;
  }

  .unit-phoneme {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--accent-blue);
  }

  .character-stage.overview-mode .unit-phoneme {
    display: none;
  }

  /* Sight Word Box (for 🔴 완전 통암기) */
  .sight-card {
    text-align: center;
    padding: 14px 18px;
    width: 100%;
  }

  .sight-big {
    font-size: 2.2rem;
    font-weight: 900;
    color: #991b1b;
    margin-bottom: 6px;
  }

  .sight-tip {
    font-size: 0.9rem;
    font-weight: 700;
    color: #7f1d1d;
    background: #fee2e2;
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
  }

  /* Formula & Tip Strip */
  .formula-box {
    margin-top: 12px;
    background: #f8fafc;
    border: 1.5px solid #e2e8f0;
    border-radius: 14px;
    padding: 10px 12px;
    font-size: 0.84rem;
    line-height: 1.5;
  }

  .formula-line {
    font-weight: 700;
    color: #1e293b;
  }

  .tip-line {
    margin-top: 4px;
    color: #b45309;
    font-weight: 700;
  }

  .example-line {
    margin-top: 4px;
    color: #475569;
    font-size: 0.8rem;
  }

  /* Action Buttons */
  .action-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 14px;
  }

  .act-btn {
    border: none;
    border-radius: 14px;
    padding: 12px 8px;
    font-size: 0.88rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  .act-btn:active {
    transform: translateY(2px);
  }

  .btn-phonemes {
    background: #e0f2fe;
    color: #0369a1;
    box-shadow: 0 4px 0 #7dd3fc;
  }

  .btn-syllable {
    background: #fef3c7;
    color: #92400e;
    box-shadow: 0 4px 0 #fcd34d;
  }

  .btn-full {
    background: #16a34a;
    color: #ffffff;
    box-shadow: 0 4px 0 #15803d;
  }

  .nav-row {
    display: grid;
    grid-template-columns: 1fr 1.4fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }

  .nav-btn {
    border: 1.5px solid #cbd5e1;
    background: #ffffff;
    color: #0f172a;
    border-radius: 12px;
    padding: 10px 8px;
    font-size: 0.86rem;
    font-weight: 800;
    cursor: pointer;
  }

  .nav-next-step {
    background: #1e293b;
    color: #ffffff;
    border-color: #1e293b;
  }

  .status-msg {
    margin-top: 8px;
    text-align: center;
    font-size: 0.76rem;
    color: var(--muted);
    min-height: 18px;
  }

  @media (max-width: 520px) {
    .target-word { font-size: 1.65rem; }
    .char-img { width: 46px; height: 54px; }
    .block-unit { min-width: 56px; }
    .action-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <!-- Top Controls -->
  <div class="top-bar">
    <div class="brand-row">
      <div class="brand-title">🌲 알파랜드 음절 스테이지 파닉스</div>
      <div class="word-counter" id="wordCounter">0 / 0</div>
    </div>

    <div class="filter-row" id="filterRow">
      <button class="filter-btn active" data-filter="ALL">전체 (852)</button>
      <button class="filter-btn" data-filter="🟢 파닉스 디코딩">🟢 디코딩 (645)</button>
      <button class="filter-btn" data-filter="🟡 부분 통암기">🟡 부분암기 (149)</button>
      <button class="filter-btn" data-filter="🔴 완전 통암기">🔴 통암기 (58)</button>
      <button class="filter-btn" data-filter="⭐ 초등800 & 영상일치">⭐ 영상일치 (168)</button>
    </div>

    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="영단어 또는 한글 뜻 검색 (예: school, restaurant)" />
      <select id="wordSelect" class="word-select" aria-label="단어 선택"></select>
      <button id="randomBtn" class="mini-btn" type="button">랜덤</button>
    </div>
  </div>

  <!-- Main Stage -->
  <div class="stage-card">
    <div class="word-meta-top">
      <div class="badge-group">
        <span class="sw-badge" id="swBadge">-</span>
        <span class="cat-badge" id="catBadge">-</span>
      </div>
      <div class="ep-info" id="epInfo">-</div>
    </div>

    <div class="word-headline">
      <div>
        <span class="target-word" id="targetWord">-</span>
        <span class="target-ipa" id="targetIpa"></span>
      </div>
      <div class="target-ko" id="targetKo">-</div>
    </div>

    <!-- Syllable Strip -->
    <div class="syl-strip" id="sylStrip"></div>

    <!-- Step Guide Banner -->
    <div class="step-banner" id="stepBanner">준비 중...</div>

    <!-- Single-Syllable / Overview Stage -->
    <div class="character-stage" id="characterStage"></div>

    <!-- Formula & Tip -->
    <div class="formula-box">
      <div class="formula-line" id="formulaLine">-</div>
      <div class="tip-line" id="tipLine"></div>
      <div class="example-line" id="exampleLine"></div>
    </div>

    <!-- Audio Blending Actions -->
    <div class="action-row">
      <button class="act-btn btn-phonemes" id="playPhonemesBtn" type="button">1️⃣ 음가 각각 읽기</button>
      <button class="act-btn btn-syllable" id="playSyllableBtn" type="button">2️⃣ 음절 합쳐 읽기</button>
      <button class="act-btn btn-full" id="playFullBtn" type="button">3️⃣ 전체 단어 읽기</button>
    </div>

    <!-- Navigation -->
    <div class="nav-row">
      <button class="nav-btn" id="prevWordBtn" type="button">◀ 이전 단어</button>
      <button class="nav-btn nav-next-step" id="guidedNextBtn" type="button">▶ 다음 단계 / 음절</button>
      <button class="nav-btn" id="nextWordBtn" type="button">다음 단어 ▶</button>
    </div>

    <div class="status-msg" id="statusMsg">음가 파일: sounds/phonemes/{id}.mp3 · 캐릭터: images/alphablocks/</div>
  </div>
</div>

function getImageCandidates(letterChar) {
  const ch = letterChar.toLowerCase();
  const up = letterChar.toUpperCase();
  if (ch === "e" && currentWordIsMagicE()) {
    return [`${IMG_BASE}MagicE.webp`, `${IMG_BASE}AB_E.webp`];
  }
  return [
    `${IMG_BASE}AB_${up}.webp`,
    `${IMG_BASE}${up}.webp`,
    `${IMG_BASE}AB_${ch}.webp`,
    `${IMG_BASE}${ch}.webp`
  ];
}

let _tempMagicE = false;
function currentWordIsMagicE() { return _tempMagicE; }

function createCharImg(letter, isMagicE = false) {
  _tempMagicE = isMagicE;
  const img = document.createElement("img");
  img.className = "char-img";
  img.alt = letter;

  const candidates = isMagicE
    ? [`${IMG_BASE}MagicE.webp`, `${IMG_BASE}AB_E.webp`, `${IMG_BASE}E.webp`]
    : [
        `${IMG_BASE}AB_${letter.toUpperCase()}.webp`,
        `${IMG_BASE}${letter.toUpperCase()}.webp`,
        `${IMG_BASE}AB_${letter.toLowerCase()}.webp`,
        `${IMG_BASE}${letter.toLowerCase()}.webp`
      ];

  let cIdx = 0;
  function tryNext() {
    if (cIdx >= candidates.length) {
      const fb = document.createElement("div");
      fb.className = "char-fallback";
      fb.textContent = letter.toUpperCase();
      img.replaceWith(fb);
      return;
    }
    img.src = candidates[cIdx++];
  }
  img.onerror = tryNext;
  tryNext();
  return img;
}

function getLettersForGrapheme(g) {
  const clean = g.replace(/[()]/g, "");
  if (clean.endsWith("_e") && clean.length === 3) {
    // e.g., i_e -> ['i', 'e(magic)']
    return [{ ch: clean[0], magic: false }, { ch: "e", magic: true }];
  }
  return clean.split("").map(c => ({ ch: c, magic: false }));
}

function applyFilters(keepCurrentWord = false) {
  const prevWord = keepCurrentWord && filteredList[currentIdx] ? filteredList[currentIdx].w : null;
  const q = searchQuery.trim().toLowerCase();

  filteredList = DB.filter(item => {
    const matchFilter =
      currentFilter === "ALL" ||
      item.sw === currentFilter ||
      item.cat === currentFilter;
    const matchSearch =
      !q ||
      item.w.toLowerCase().includes(q) ||
      item.ko.toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });

  if (filteredList.length === 0) {
    filteredList = [DB[0]];
    statusMsg.textContent = "검색 결과가 없어 첫 단어로 표시합니다.";
  }

  wordSelect.innerHTML = "";
  filteredList.forEach((item, idx) => {
    const opt = document.createElement("option");
    opt.value = idx;
    opt.textContent = `${item.no}. ${item.w} (${item.ko})`;
    wordSelect.appendChild(opt);
  });

  if (prevWord) {
    const found = filteredList.findIndex(x => x.w === prevWord);
    currentIdx = found >= 0 ? found : 0;
  } else {
    currentIdx = 0;
  }

  currentSylIdx = 0;
  renderCurrentWord();
}

function getCurrentWord() {
  return filteredList[currentIdx] || DB[0];
}

function renderCurrentWord() {
  stopAudio();
  const item = getCurrentWord();
  wordSelect.value = currentIdx;
  wordCounter.textContent = `${currentIdx + 1} / ${filteredList.length} (전체 ${DB.length})`;

  // Badges
  swBadge.textContent = item.sw;
  swBadge.className = "sw-badge " + (
    item.sw.includes("완전") ? "sw-core" :
    item.sw.includes("부분") ? "sw-heart" : "sw-decode"
  );
  catBadge.textContent = item.cat;
  epInfo.textContent = item.ep && item.ep !== "(파닉스 확장 어휘)"
    ? `${item.ep} · ${item.title}`
    : item.phonics;

  targetWord.textContent = item.w;
  targetIpa.textContent = item.ipa;
  targetKo.textContent = item.ko;

  formulaLine.textContent = `블렌딩 공식: ${item.blend}  |  44음가: ${item.seq}`;
  tipLine.textContent = item.sw.includes("디코딩") ? "" : `💡 ${item.tip}`;
  exampleLine.textContent = item.ex ? `예문: ${item.ex}` : "";

  renderSyllableStrip(item);
  renderStage(item);
}

function renderSyllableStrip(item) {
  sylStrip.innerHTML = "";
  if (item.sw.includes("완전 통암기")) return;

  const syls = item.m && item.m.length ? item.m : [{ syl: item.w, units: [] }];
  syls.forEach((s, idx) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "syl-chip" + (currentSylIdx === idx ? " active" : (currentSylIdx > idx || currentSylIdx === -1 ? " done" : ""));
    btn.textContent = `${idx + 1}음절 [${s.syl}]`;
    btn.addEventListener("click", () => {
      stopAudio();
      currentSylIdx = idx;
      renderSyllableStrip(item);
      renderStage(item);
    });
    sylStrip.appendChild(btn);
  });

  if (syls.length > 1) {
    const allBtn = document.createElement("button");
    allBtn.type = "button";
    allBtn.className = "syl-chip all-chip" + (currentSylIdx === -1 ? " active" : "");
    allBtn.textContent = `전체 합체 (${item.w})`;
    allBtn.addEventListener("click", () => {
      stopAudio();
      currentSylIdx = -1;
      renderSyllableStrip(item);
      renderStage(item);
    });
    sylStrip.appendChild(allBtn);
  }
}

function renderStage(item) {
  characterStage.innerHTML = "";
  characterStage.classList.remove("overview-mode");

  // Mode 1: 🔴 완전 통암기 -> Whole word sight card
  if (item.sw.includes("완전 통암기")) {
    stepBanner.textContent = "🔴 사이트워드 모드: 규칙 예외 단어이므로 쪼개지 않고 통째로 듣고 따라 읽어요!";
    characterStage.innerHTML = `
      <div class="sight-card">
        <div class="sight-big">${escapeHtml(item.w)}</div>
        <div class="sight-tip">${escapeHtml(item.tip || "단어 모양과 소리를 통째로 익히세요.")}</div>
      </div>
    `;
    return;
  }

  const syls = item.m && item.m.length ? item.m : [];

  // Mode 2: Full-word overview (-1)
  if (currentSylIdx === -1) {
    characterStage.classList.add("overview-mode");
    stepBanner.textContent = `🌟 전체 합체 스테이지: [${item.syl}] → "${item.w}" 전체 단어를 읽어보세요!`;
    syls.forEach((s, sIdx) => {
      (s.units || []).forEach((u, uIdx) => {
        characterStage.appendChild(buildUnitCard(u, `u-${sIdx}-${uIdx}`));
      });
    });
    return;
  }

  // Mode 3: Single-syllable stage (no mobile wrapping/overflow!)
  const sylObj = syls[currentSylIdx] || { syl: item.w, units: [] };
  const units = sylObj.units || [];
  const spokenParts = units
    .filter(u => u.type !== "silent" && u.p && u.p.length > 0)
    .map(u => u.g.replace(/[()]/g, ""));

  stepBanner.textContent =
    `음절 ${currentSylIdx + 1}/${syls.length} [${sylObj.syl}]: ` +
    (spokenParts.length ? `${spokenParts.join(" + ")} → "${sylObj.syl}" 합쳐 읽기` : `묵음/예외 구간`);

  units.forEach((u, idx) => {
    characterStage.appendChild(buildUnitCard(u, `u-${currentSylIdx}-${idx}`));
  });
}

function buildUnitCard(unit, domId) {
  const div = document.createElement("div");
  div.id = domId;
  div.className = "block-unit";
  if (unit.type === "team") div.classList.add("team-unit");
  if (unit.type === "magic_e") div.classList.add("magic-unit");
  if (unit.type === "silent") div.classList.add("silent-unit");

  if (unit.type === "team") {
    const tag = document.createElement("span");
    tag.className = "unit-tag tag-team";
    tag.textContent = "한팀";
    div.appendChild(tag);
  } else if (unit.type === "magic_e") {
    const tag = document.createElement("span");
    tag.className = "unit-tag tag-magic";
    tag.textContent = "Magic E";
    div.appendChild(tag);
  } else if (unit.type === "silent") {
    const tag = document.createElement("span");
    tag.className = "unit-tag tag-silent";
    tag.textContent = "묵음";
    div.appendChild(tag);
  }

  const pair = document.createElement("div");
  pair.className = "char-pair";
  const letters = getLettersForGrapheme(unit.g);
  letters.forEach(l => pair.appendChild(createCharImg(l.ch, l.magic)));
  div.appendChild(pair);

  const gLabel = document.createElement("div");
  gLabel.className = "unit-grapheme";
  gLabel.textContent = unit.g;
  div.appendChild(gLabel);

  const pLabel = document.createElement("div");
  pLabel.className = "unit-phoneme";
  pLabel.textContent = unit.p && unit.p.length ? unit.p.join("+") : "소리 없음";
  div.appendChild(pLabel);

  div.addEventListener("click", async () => {
    stopAudio();
    const token = ++playToken;
    if (unit.p && unit.p.length) {
      setSpeaking(domId, true);
      for (const pid of unit.p) {
        if (token !== playToken) break;
        await playAudioFile(`${AUDIO_BASE}${pid}.mp3`);
      }
      setSpeaking(domId, false);
    } else {
      statusMsg.textContent = `'${unit.g}'은 이 단어에서 소리 나지 않는 구간입니다.`;
    }
  });

  return div;
}

function setSpeaking(domId, active) {
  document.querySelectorAll(".block-unit.speaking").forEach(el => el.classList.remove("speaking"));
  if (active && domId) {
    const el = document.getElementById(domId);
    if (el) el.classList.add("speaking");
  }
}

function stopAudio() {
  playToken++;
  isPlaying = false;
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
  setSpeaking(null, false);
}

function playAudioFile(url) {
  return new Promise(resolve => {
    const audio = new Audio(url);
    let settled = false;
    const done = (msg) => {
      if (!settled) {
        settled = true;
        if (msg) statusMsg.textContent = msg;
        resolve();
      }
    };
    audio.onended = () => done();
    audio.onerror = () => done(`오디오 파일 확인 필요: ${url} (TTS 대체 가능)`);
    audio.play().catch(() => done(`오디오 재생 안내: ${url}`));
  });
}

function speakTTS(text, rate = 0.88) {
  return new Promise(resolve => {
    if (!("speechSynthesis" in window)) {
      resolve();
      return;
    }
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-US";
    utter.rate = rate;
    utter.onend = () => resolve();
    utter.onerror = () => resolve();
    window.speechSynthesis.speak(utter);
  });
}

// 1️⃣ 음가 각각 읽기 (현재 음절 기준)
document.getElementById("playPhonemesBtn").addEventListener("click", async () => {
  const item = getCurrentWord();
  stopAudio();
  const token = ++playToken;
  isPlaying = true;

  if (item.sw.includes("완전 통암기")) {
    statusMsg.textContent = "완전 통암기 단어는 '3️⃣ 전체 단어 읽기'로 통째로 들어보세요!";
    return;
  }

  const syls = item.m || [];
  const targetSyls = currentSylIdx === -1 ? syls : [syls[currentSylIdx]].filter(Boolean);

  for (let s = 0; s < targetSyls.length; s++) {
    const actualSylIdx = currentSylIdx === -1 ? s : currentSylIdx;
    const sylObj = targetSyls[s];
    const units = sylObj.units || [];

    for (let uIdx = 0; uIdx < units.length; uIdx++) {
      if (token !== playToken) return;
      const u = units[uIdx];
      const domId = `u-${actualSylIdx}-${uIdx}`;
      if (u.p && u.p.length > 0) {
        statusMsg.textContent = `음가 재생: [${u.g}] → ${u.p.join(" + ")}`;
        setSpeaking(domId, true);
        for (const pid of u.p) {
          if (token !== playToken) return;
          await playAudioFile(`${AUDIO_BASE}${pid}.mp3`);
        }
        setSpeaking(domId, false);
        await sleep(160);
      }
    }
  }
  isPlaying = false;
  statusMsg.textContent = "음가 각각 읽기 완료! 이제 '2️⃣ 음절 합쳐 읽기'를 눌러보세요.";
});

// 2️⃣ 음절 합쳐 읽기
document.getElementById("playSyllableBtn").addEventListener("click", async () => {
  const item = getCurrentWord();
  stopAudio();
  const token = ++playToken;

  if (item.sw.includes("완전 통암기")) {
    await speakTTS(item.w, 0.85);
    return;
  }

  const syls = item.m || [];
  const sylObj = currentSylIdx >= 0 ? syls[currentSylIdx] : null;
  const speakTarget = sylObj ? sylObj.syl : item.w;
  statusMsg.textContent = `음절 합쳐 읽기: "${speakTarget}"`;
  await speakTTS(speakTarget, 0.82);
});

// 3️⃣ 전체 단어 읽기
document.getElementById("playFullBtn").addEventListener("click", async () => {
  const item = getCurrentWord();
  stopAudio();
  statusMsg.textContent = `전체 단어 읽기: "${item.w}" (${item.ko})`;
  await speakTTS(item.w, 0.92);
});

// Guided Next Step / Syllable
document.getElementById("guidedNextBtn").addEventListener("click", async () => {
  const item = getCurrentWord();
  if (item.sw.includes("완전 통암기")) {
    await speakTTS(item.w, 0.9);
    return;
  }
  const syls = item.m || [];
  if (currentSylIdx >= 0 && currentSylIdx < syls.length - 1) {
    currentSylIdx++;
    renderSyllableStrip(item);
    renderStage(item);
    await speakTTS(syls[currentSylIdx].syl, 0.85);
  } else if (currentSylIdx !== -1 && syls.length > 1) {
    currentSylIdx = -1;
    renderSyllableStrip(item);
    renderStage(item);
    await speakTTS(item.w, 0.9);
  } else {
    await speakTTS(item.w, 0.9);
  }
});

// Navigation & Search Events
document.getElementById("prevWordBtn").addEventListener("click", () => {
  currentIdx = (currentIdx - 1 + filteredList.length) % filteredList.length;
  currentSylIdx = 0;
  renderCurrentWord();
});

document.getElementById("nextWordBtn").addEventListener("click", () => {
  currentIdx = (currentIdx + 1) % filteredList.length;
  currentSylIdx = 0;
  renderCurrentWord();
});

wordSelect.addEventListener("change", (e) => {
  currentIdx = Number(e.target.value) || 0;
  currentSylIdx = 0;
  renderCurrentWord();
});

searchInput.addEventListener("input", (e) => {
  searchQuery = e.target.value;
  applyFilters(false);
});

randomBtn.addEventListener("click", () => {
  currentIdx = Math.floor(Math.random() * filteredList.length);
  currentSylIdx = 0;
  renderCurrentWord();
});

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    applyFilters(false);
  });
});

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

// Init
applyFilters(false);
</script>
</body>
